<head>

<title>晨间看板</title>
<style>
  :root {
    --bg-deep: #1a1040;
    --bg-mid: #3d1f54;
    --bg-warm: #7a3b4a;
    --bg-sunrise: #c4623c;
    --bg-golden: #e8a850;
    --bg-cream: #f5e6d0;
    --card-bg: rgba(0, 0, 0, 0.22);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-primary: #f5e6d0;
    --text-secondary: rgba(245, 230, 208, 0.82);
    --text-muted: rgba(245, 230, 208, 0.55);
    --accent: #e8a850;
    --accent-warm: #c4623c;
    --tag-trusted: #4ade80;
    --tag-question: #fbbf24;
    --tag-doubt: #f87171;
    --tag-manipulated: #a78bfa;
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font-display);
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 18%, var(--bg-warm) 35%, var(--bg-sunrise) 52%, #9a4a30 68%, #2d1810 100%);
    background-attachment: fixed;
    min-height: 100vh; min-height: 100dvh;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px 16px;
    padding-bottom: calc(40px + var(--safe-bottom));
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.25) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .app-container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .header { text-align: center; padding: 30px 0 20px; }
  .header-date { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.15em; margin-bottom: 6px; }
  .header-greeting { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.05em; background: linear-gradient(135deg, var(--bg-golden), var(--bg-cream)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-weather { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
  .section { margin-bottom: 24px; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; padding-left: 4px; }
  .section-icon { font-size: 1.2rem; }
  .section-count { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: auto; }
  .card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; transition: transform 0.2s ease; position: relative; overflow: hidden; }
  .card:active { transform: scale(0.985); }
  .card-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 20px; margin-bottom: 8px; }
  .tag-trusted { background: rgba(74, 222, 128, 0.15); color: var(--tag-trusted); }
  .tag-question { background: rgba(251, 191, 36, 0.15); color: var(--tag-question); }
  .tag-doubt { background: rgba(248, 113, 113, 0.15); color: var(--tag-doubt); }
  .tag-manipulated { background: rgba(167, 139, 250, 0.15); color: var(--tag-manipulated); }
  .card-headline { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; }
  .card-brief { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; }
  .card-analysis { background: rgba(0, 0, 0, 0.2); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; }
  .card-analysis-label { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .card-analysis-row { display: flex; gap: 8px; margin-bottom: 4px; font-size: 0.8rem; line-height: 1.5; }
  .card-analysis-key { color: var(--text-muted); flex-shrink: 0; min-width: 52px; }
  .card-analysis-val { color: var(--text-secondary); }
  .card-meta { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; }
  .card-source { display: inline-flex; align-items: center; gap: 4px; }
  .card-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .topic-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; padding: 8px 14px; font-size: 0.82rem; color: var(--text-primary); transition: all 0.2s ease; cursor: default; }
  .topic-chip.manipulated { border-color: rgba(167, 139, 250, 0.3); background: rgba(167, 139, 250, 0.08); }
  .topic-heat { font-size: 0.68rem; color: var(--text-muted); }
  .manipulated-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-manipulated); flex-shrink: 0; }
  .topic-note { font-size: 0.68rem; color: var(--tag-manipulated); margin-top: 4px; }
  .stock-card .card-headline { display: flex; align-items: center; gap: 8px; }
  .stock-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(232, 168, 80, 0.2); color: var(--accent); letter-spacing: 0.05em; flex-shrink: 0; }
  .stock-code { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; }
  .tombstone { text-align: center; padding: 28px 20px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); position: relative; overflow: hidden; }
  .tombstone::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.08) 0%, transparent 60%); pointer-events: none; }
  .tombstone-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; }
  .tombstone-quote { font-size: 1.3rem; font-weight: 700; color: var(--bg-cream); line-height: 1.6; margin-bottom: 12px; letter-spacing: 0.05em; }
  .tombstone-sub { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
  .tombstone-actions { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }
  .tombstone-action { display: flex; align-items: flex-start; gap: 6px; text-align: left; }
  .tombstone-action-num { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .tombstone-divider { width: 40px; height: 1px; background: rgba(232, 168, 80, 0.3); margin: 12px auto; }
  .footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); padding: 30px 0 10px; }
  .footer-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 0 6px; opacity: 0.5; }
  .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }
  .delay-5 { animation-delay: 0.5s; }
  @media (min-width: 481px) { body { padding: 30px 24px; } .header-greeting { font-size: 2rem; } .card { padding: 20px; } }
  .pull-indicator { text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 8px 0; opacity: 0; transition: opacity 0.3s ease; }
</style>
</head>

    <div class="header-date" id="headerDate"></div>

<script>
(async function() {
  // Date
  const now = new Date();
  const wd = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('headerDate').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · '+wd[now.getDay()];
  const h = now.getHours();
  document.querySelector('.header-greeting').textContent = h<9?'早上好，小弟':h<12?'上午好，小弟':h<18?'下午好，小弟':'晚上好，小弟';

  // Inline data - no fetch needed
  const data = {"date": "2026-08-06", "greeting": "早上好，小弟", "weather": "深圳 · 多云间晴 · 26~33°C（6-10日最高36℃+）", "图景": [{"tag": "主动出牌", "tagType": "trusted", "headline": "【8.5-8.6】商务部对美反制落地：6家美国实体入清单+无人机对美出口从严审核——博弈从应对转向出牌", "brief": "8月5日，商务部宣布对美国联邦通信委员会、国土安全部系列涉华消极措施实施反制：将应用DNA科学公司等6家美国实体列入反制清单，并加强无人机相关两用物项对美国出口管制——列入管制清单的无人机及关键零部件、相关技术对美出口逐案从严审核，不适用许可便利措施。此前，美方正起草法规拟禁止进口中国产新型光收发模块，外交部回应坚决反对泛化国家安全概念。", "analysis": {"谁在操盘": "商务部选在美方连续出招（FCC、国土安全部、光模块禁令）之后反制，节奏清晰：你打你的，我打我的。6家实体+无人机管制是精确打击，不是全面对抗——瞄准的是美方依赖中国供应链的环节，这是「以我之长攻彼之短」。", "话语权归属": "「反制清单」的潜台词是：规则不是单方面定的。美国用「国家安全」定义它的禁令，中国用「出口管制法」定义它的反制——两边都在抢「合法性」的话语权。谁的法律框架更自洽，谁在国际舆论场就更站得住。", "受益方": "无人机产业链是明牌：大疆等龙头对美出口受限短期承压，但国内无人机配套、国产替代环节直接受益。光模块禁令一旦落地，国内光模块厂商的国产化率反而会被推高——打压与替代，从来是硬币的两面。", "中道视角": "反制是必要的，但别指望「你死我活」——中美博弈的本质是边打边谈。中道的态度：看清单里的实体（明确信号），看管制的环节（卡脖子位置），把「博弈升级」当作确定性事件来配置国产替代主线，但仓位留余地——牌桌上的人不会掀桌子，只会加注。"}, "source": "商务部 · 外交部 · 8月5-6日"}, {"tag": "第六天反转", "tagType": "question", "headline": "【8.5-8.6】伊朗称霍尔木兹协议「接近达成」、与阿曼谈判进入最后阶段：喊了六天的谈判终于要落地？", "brief": "当地时间8月5日，伊朗外长表示与阿曼就霍尔木兹海峡的谈判已进入最后阶段，伊朗正与阿曼讨论划定一条海峡新航线。特朗普同日称美伊将谈判。受此影响，国际油价显著下跌，美油主力合约报75.08美元/桶。此前六天，美伊经历「放风轰炸-取消打击-谈判罗生门-边谈边打」的连续反转。", "analysis": {"谁在操盘": "六天反转后，伊朗主动释放「接近达成」的信号——选择权回到伊朗手里：谈，是它主动说接近达成；不打，是它先提出暂缓。谈判桌上的主动权重回伊朗，这是它用六天博弈换来的位置。", "话语权归属": "注意措辞：「与阿曼谈判」而非「与美国谈判」——伊朗刻意把美国排除在直接对话之外，保持「不是我在求美国」的姿态。中间人外交是伊朗的护城河：谈成了是伊朗的功劳，谈崩了是美国的错。", "受益方": "油价显著下跌利好全球进口国消费者，欧佩克+的增产计划有了落地空间。但「接近达成」不等于「达成」——前六天的反转已经证明，这条消息随时可能再反转。", "中道视角": "「接近达成」是谈判的标准话术，翻译过来是「还差最后一公里，都别松劲」。中道的态度：把它当趋势信号（方向在缓和），不当结论（细节未定）。油价承压是真，但单日波动率还会继续——别因为一句话就重仓押方向。"}, "source": "新华社 · 路透社 · 8月5-6日"}, {"tag": "商品扭曲", "tagType": "question", "headline": "【8.5-8.6】美国抢铜潮：单月20万吨铜涌入、库存破100万吨——关税预期正在扭曲全球商品流动", "brief": "为锁定成本、规避潜在关税风险，国际贸易商正以前所未有的速度向美国抢运金属铜：7月约20万吨铜运抵美国，刷新单月最高流入纪录，美国境内铜总库存量或已突破100万吨。此前美方多次放风对铜加征关税，将铜视为「国家安全」关键金属。", "analysis": {"谁在操盘": "关税预期是导演：美国一边放风对铜征税，贸易商一边抢在征税前把铜运进美国——关税还没落地，市场已经自己完成了「进口冲刺」。这就是政策预期的扭曲力：一句话比一万次交易还管用。", "话语权归属": "美国把铜定义为「国家安全金属」，本质上是在给关税造合法性——和半导体、无人机一个套路：先造「威胁」叙事，再行「保护」之实。但市场不傻：抢铜潮恰恰证明，美国自己的产业也依赖全球供应链。", "受益方": "抢运的贸易商赚了价差，美国本土铜库存虚高；受损方是全球铜市场的正常流动——其他地区的铜供应短期被抽走，价格波动被放大。对中国来说，铜是进口大户，全球铜价波动直接影响成本端。", "中道视角": "关税战打到最后，都是消费者和供应链买单。中道的态度：把「抢铜潮」当作流动性扭曲的样本——凡是政策干预的价格，都会在政策落地后回归。别追抢运的尾巴，等关税尘埃落定再看真实供需。"}, "source": "新华社 · 每经 · 8月5-6日"}], "热搜": [{"text": "#余承东回应口误#", "heat": "1683万", "manipulated": true}, {"text": "#劝华为大度的人请先尊重法律#", "heat": "1208万", "manipulated": true}, {"text": "#戴手链美甲给宝宝打针护士已停职#", "heat": "1042万", "manipulated": false}, {"text": "#AI辅助减肥45天瘦40斤险丧命#", "heat": "986万", "manipulated": false}, {"text": "#梅姨真实姓名曝光#", "heat": "894万", "manipulated": false}, {"text": "#享界G9预售43.98万起#", "heat": "765万", "manipulated": true}, {"text": "#90后改娃师月入3万#", "heat": "623万", "manipulated": true}, {"text": "#海南事业编招考现断崖式分差#", "heat": "548万", "manipulated": false}], "A股": [{"badge": "并购", "headline": "锴威特拟16.5亿收购晶艺半导体：功率半导体并购再落一子，国产替代加速整合", "code": "688693.SH", "brief": "锴威特披露重大资产重组草案：拟通过发行股份及支付现金收购晶艺半导体100%股权，整体对价16.5亿元（股份支付9.01亿+现金7.49亿）。晶艺半导体是Fabless功率半导体企业，主营电机驱动类、电源管理类功率IC，在售产品超300款。业绩承诺：芯片定制化业务2026-2027累计净利润不低于2.55亿元。", "analysis": {"真实意图": "功率半导体「功率器件+功率IC」双轮驱动，收购补齐产品矩阵——这是国产替代逻辑下的标准动作：与其自己研发十年，不如并购现成的产品线和客户。16.5亿的对价，绑定2.55亿净利承诺，估值不算激进。", "话语权分析": "在全球半导体整合浪潮下，并购重组是政策明确鼓励的方向。锴威特的案例说明：科创板小市值公司正在用并购换成长——这可能是未来两年的主线。", "中道提醒": "并购是捷径，但整合是难关：Fabless公司的核心资产是人，人留不留得住、客户跟不跟得走，才是并购成败的关键。业绩承诺是保底，不是天花板——看交割后的整合进展，比看公告时的股价重要。"}, "source": "公司公告 · 8月5日"}, {"badge": "回购", "headline": "长源东谷拟1.5-3亿回购：获2.7亿回购专项贷款，回购贷款工具持续发力", "code": "603950.SH", "brief": "长源东谷披露回购报告书：拟以自有资金或自筹资金回购1.5-3亿元股份，用于维护公司价值及股东权益，回购价格不超过70元/股。公司已取得中信银行2.7亿元股票回购专项贷款承诺函。同日，伯特利、新特电气、正弦电气等多家公司也发布回购方案。", "analysis": {"真实意图": "回购专项贷款是这一轮回购潮的「燃料」：上市公司用2.7亿的银行贷款撬动最高3亿的回购——杠杆回购时代来了。政策层的意思很明确：钱可以借给你回购，但要用在稳定股价上。", "观察点": "「维护公司价值及股东权益」用途的回购，后续大概率注销或出售——比「用于激励」含金量高。但要注意：贷款回购的前提是股价有支撑，若股价继续下跌，回购成本就是实打实的亏损。", "中道提醒": "回购贷款工具是政策的诚意，但别把「政策支持」当「公司价值」——回购解决短期情绪，业绩解决长期。借来的钱回购的股票，最终还是要靠基本面还。"}, "source": "公司公告 · 证券时报 · 8月5日"}], "深圳": [{"headline": "国内首个千比特规模量子计算算力平台在深圳发布", "brief": "8月5日，国内首个千比特规模的量子计算算
