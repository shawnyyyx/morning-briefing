个国家的2000多名代表参会。与会人士呼吁非洲各国深化区域民航合作、推动航空安全标准互认，依托《非洲大陆自由贸易区协定》释放经济增长潜力。", "note": "非洲有54国、超14亿人，却是全球航空联通性最差的区域之一——把天空连起来，比修铁路更快地拉动贸易和旅游。"}, {"rank": 2, "title": "肯尼亚的「两副面孔」：赶走无证外籍小贩，却迎Oracle首个非洲云区域，FDI创纪录", "level": "热", "heat": "路透社", "brief": "肯尼亚一边给无证外籍小商贩90天限期补手续（此前引发数百布隆迪人涌向使馆），一边在美商会峰会上宣布：外国直接投资升至创纪录的32亿美元（2022年为15亿），Oracle将把肯尼亚作为其非洲首个公有云区域所在地，可口可乐承诺投资1.75亿美元。", "note": "肯尼亚的政策方向很明确：大项目欢迎外资，低门槛小生意优先留给本地人——非洲的「本地化」，正在从小摊贩蔓延到云服务。"}, {"rank": 3, "title": "南非二季度GDP萎缩：近两年来首次季度收缩，矿业制造业拖累增长", "level": "新", "heat": "路透社", "brief": "官方数据显示，2026年第二季度南非GDP出现收缩，为近两年来首次季度经济萎缩，矿业和制造业表现疲弱拖累整体增长，国际局势波动也抑制了国内需求。", "note": "南非不缺工业体系，缺的是让体系转起来的电力和效率——「有没有工业」和「工业能不能扩张」，是两道题。"}]}, {"洲": "美洲", "emoji": "🌎", "items": [{"rank": 1, "title": "加拿大对美反制关税今日正式生效：覆盖钢铁、乳制品、电子产品等；美方随即公布新一轮对加举措", "level": "沸", "heat": "加财政部", "brief": "加拿大对美国商品加征的反制关税9月8日正式生效，覆盖钢铁、乳制品、农用设备、纸浆及电子产品等。美国随即公布针对加拿大的新一轮贸易举措。叠加特朗普「扩张版美国地图」将加拿大画入星条旗，这对「最亲密邻居」正在用关税重新定义关系。", "note": "关税大棒挥向最铁的邻居，加拿大这次没有跪，反手对等加税——盟友之间算起账来，比对手之间还狠。"}, {"rank": 2, "title": "第81届联合国大会在纽约开幕：主题聚焦「重建信任与管理变革」", "level": "热", "heat": "新华社", "brief": "第81届联合国大会9月8日起在纽约开幕，本届联大聚焦「重建信任和管理变革」。在全球冲突多点爆发、多边机制承压的背景下，193个会员国将围绕改革议程展开新一轮博弈。", "note": "把「重建信任」当主题，恰恰说明信任已经不多了——越是吵得凶的时候，越需要一个所有人都坐下来说话的桌子。"}, {"rank": 3, "title": "墨西哥图尔蒂特兰洪灾善后持续：城铁泄漏事故6人遇难引发基础设施安全之问", "level": "新", "heat": "新华社", "brief": "墨西哥州图尔蒂特兰地区近日洪灾中，一辆被洪水围困的城铁车厢发生天然气泄漏，致6人疑似中毒死亡。当地仍在开展排涝与善后，暴雨、内涝与老旧基础设施叠加的教训持续发酵。", "note": "同样的暴雨，不同的城市交出不同的伤亡数字——天灾的账，一半记在天气头上，一半记在基础设施头上。"}]}, {"洲": "大洋洲", "emoji": "🌏", "items": [{"rank": 1, "title": "历史性一刻：澳洲8月电动车销量首超汽油车，比亚迪称「临界点已过」", "level": "沸", "heat": "澳洲汽车媒体", "brief": "8月澳大利亚纯电动车销量达27078辆，首次超过汽油车（25824辆），占新车市场四分之一。比亚迪发言人表示，油价暴涨与中国平价车型涌入改变了消费者态度。丰田仍居品牌榜首，比亚迪与特斯拉分列二、三位，能源部长称这是「里程碑时刻」。", "note": "澳洲这个「油车王国」，一个月的销量就翻了天——临界点很少是慢慢到的，它往往是突然到的。"}, {"rank": 2, "title": "澳洲房市遇40年最严重下行：新州印花税暴跌20%、评级展望负面、3472家建筑商倒闭", "level": "热", "heat": "澳洲财经", "brief": "澳大利亚房地产市场正经历40年来最严重的下行周期：新州7月印花税收入同比暴跌20%、住宅成交量降18.5%，州评级展望转负面；过去一年全国3472家建筑公司倒闭，悉尼一开发商欠债34亿澳元进入托管，超2000套公寓停工。", "note": "住房危机最讽刺的一面是：不是没人买得起，而是没人盖得起——成本太高、融资太难、利润太薄，行业连倒下都排着队。"}, {"rank": 3, "title": "新西兰「黄金签证」扩容：12月起500万纽币级投资可投「建后出租」，用外资补租赁房供给", "level": "热", "heat": "新西兰移民局", "brief": "新西兰移民部长与住房部长9月8日宣布，「活跃投资者加强版」签证的「增长」类别自12月起允许投资「建后出租」开发项目，该类别最低投资500万纽币、期限至少三年。截至8月，此类签证已收到637份申请、涉及约37亿纽币潜在投资。", "note": "房价贵到本地人买不起，就让外国有钱人来「建房出租」——把算盘打在签证上，是缺钱又缺房的政府共同的选择。"}]}], "风向": [{"tag": "报复升级", "tagType": "question", "headline": "【9月9日】美军炸油轮、伊朗打军舰：波斯湾从「封锁战」升级成「报复战」", "brief": "9月8日，美军导弹袭击伊朗哈尔克岛附近油轮及贾斯克港目标，美中央司令部称摧毁5艘伊朗油轮；9日伊朗革命卫队宣布：为回应美方袭击，已打击并重创波斯湾2艘美国舰船和8艘油轮，并对位于约旦的美军基地实施导弹打击、击中战机机库。同日伊朗警告停泊科威特、巴林港口的油轮船员立即撤离（称这些港口「收留了美军」），美财政部则对伊朗航空业36个对象实施新一轮制裁。", "analysis": {"主要矛盾": "掀开互袭的军事动作，这局的根本矛盾没变：谁能定义霍尔木兹的通行规则。美军的封锁、伊朗的报复、阿曼的斡旋，全都围绕「海峡开关在谁手里」展开。军事是手段，规则权才是目的——抓不住这个主要矛盾，就会被每天的袭船新闻牵着鼻子走。", "战略态势": "伊朗很清楚自己打不赢美军海空力量，它也不打对称战争，这就是「你打你的，我打我的」：你炸我的油轮，我打你的军舰和基地；你封锁我的出口，我威慑你盟友的港口。不争一城一地，争的是让你每条船、每个基地都不得安宁。弱者的持久战，从来不在正面战场分胜负。", "敌友之辨": "伊朗把科威特、巴林港口摆上打击菜单，等于把中间派往美国怀里推——科威特、巴林本就是美军驻在国，这一吓未必能让美军撤走，倒可能让海湾产油国更抱团。把朋友搞得多多的、把敌人搞得少少的，这一条伊朗做得并不好。", "实事求是": "美军通报「摧毁5艘油轮」，伊朗宣布「重创2舰8船」，两边战报对不上号，都在打舆论战。没有调查就没有发言权：与其信战报，不如看油价和航运保险费率——市场用真金白银投票，比发言人的嘴巴诚实。"}, "source": "央视新闻 · 美军中央司令部 · 伊朗革命卫队 · 9月8-9日"}, {"tag": "地图开疆", "tagType": "question", "headline": "【9月9日】特朗普一张「扩张版美国地图」惹了20国：地图上画不出盟友的心", "brief": "特朗普在社交平台发布「扩张版美国地图」，把加拿大、墨西哥、冰岛、古巴等20个主权国家画进星条旗版图，冰岛当天召见美驻冰大使抗议。同日美加贸易战同步升级：加拿大对美反制关税9月8日正式生效，覆盖钢铁、乳制品、农用设备、纸浆、电子产品等，美方随即公布新一轮对加贸易举措。", "analysis": {"主要矛盾": "表面是「一张图的玩笑」加「关税的你来我往」，实质是同一个矛盾的两面：一个超级大国要地盘与利益，盟友要主权与生意，今天正面撞上了。地图是话语试探，关税是真金白银——两者是同一个扩张逻辑的不同工具。", "战略态势": "这是「纸老虎」问题在今天的表情：真刀真枪的吞并没有，地图开疆加关税大棒倒是接二连三。虚张声势之所以还有人忍，是因为实力还在；但它每画一次图、每加一轮税，都在给盟友上「独立教育课」——20国第一次有了共同的「被吞并」的恐惧，而恐惧，是最好的团结教材。", "敌友之辨": "统一战线讲究把朋友搞得多多的，特朗普反着来：格陵兰要买、巴拿马运河要收、加拿大要并、墨西哥湾要改名，一年内把周边得罪一圈。地图上画得再大，画不出人心；盟友嘴上不说，心里开始算另一本账：今天他能这样对冰岛，明天呢？", "实事求是": "别把扩张地图当纯玩笑一笑了之，也别当成真要出兵吞并的威胁。分清虚实：关税是真动作，加拿大企业是真疼；地图是话语试探，对冰岛是羞辱。哪样真、哪样虚分清了，才不会被情绪带跑——这也是「战略上藐视、战术上重视」的老道理。"}, "source": "央视新闻 · 美媒 · 冰岛外交部 · 加拿大财政部 · 9月8-9日"}], "热搜": [{"text": "#平陆运河9月16日建成通航#", "heat": "沸", "manipulated": false}, {"text": "#这样的吃播该全面叫停了#", "heat": "热", "manipulated": false}, {"text": "#上海10月1日起生娃个人不花钱#", "heat": "热", "manipulated": false}, {"text": "#这段话杀死了内耗型人格#", "heat": "热", "manipulated": true}, {"text": "#苹果用户换华为#", "heat": "热", "manipulated": true}, {"text": "#嘉华鲜花饼吐痰传闻#", "heat": "市监：与事实不符", "manipulated": false}, {"text": "#卤米松原研药涨到800元#", "heat": "热", "manipulated": false}, {"text": "#日美韩东海联合军演#", "heat": "热", "manipulated": false}], "A股": [{"badge": "并购", "headline": "湖南黄金重组获湖南省国资委批复：发股购黄金天岳+中南冶炼100%股权，配套募资不超10.5亿", "code": "002155.SZ", "brief": "湖南黄金9月9日公告，收到湖南省国资委批复，原则同意公司通过发行股份购买湖南黄金天岳矿业100%股权及湖南中南黄金冶炼100%股权，购买价格不低于经备案的资产评估值，并同意配套募资不超10.5亿元。交易尚需提交股东会审议。", "analysis": {"真实意图": "省国资委批复意味着湖南黄金资产证券化进入快车道：把黄金天岳（矿山）和中南冶炼（冶炼）整体装进上市平台，湖南国资的黄金版图从分散持有变成一个平台。金价高位时做资源整合，既是产业逻辑，也是市值逻辑。", "话语权分析": "批复是流程性利好，真正的看点在对价与注入资产质量。金价在涨，注入资产评估值也水涨船高，摊薄与增厚要算细账——别把「获批」两个字当成股价的免检通行证。", "中道提醒": "金价高位买金矿公司，买的是「金价继续涨」的预期；若金价高位震荡，业绩弹性就会变钝。批复之后还有股东会、注册两道关，落定前都存在变数。"}, "source": "上市公司公告 · 金融界 · 9月9日"}, {"badge": "澄清", "headline": "崇达技术急发澄清：与华为Mate XT 2、麒麟9050 Pro无业务关系", "code": "002815.SZ", "brief": "崇达技术9月9日发布风险提示公告，明确公司与华为Mate XT 2、麒麟9050 Pro芯片无业务关系。此前华为三折叠与麒麟芯片刷屏，资金在PCB等产业链上四处寻找「概念股」，崇达被市场当作潜在受益标的炒作，公司连夜撇清。", "analysis": {"真实意图": "华为三折叠加麒麟芯片刷屏，资金到处找概念股，崇达被推上风口——公司发澄清公告，等于官方泼冷水：别把股价炒在我身上。这种澄清既是合规要求，也是公司不想被情绪资金架着走。", "话语权分析": "A股每年都有「N家公司紧急澄清与某热点无关」的戏码——题材越热，澄清越多。澄清挡不住游资，但能帮理性投资者区分「真订单」和「真蹭热点」：看后续有没有实打实的订单与营收，而不是看它今天澄清还是明天澄清。", "中道提醒": "概念炒作期最忌追高接最后一棒。华为链是真景气，但景气也要落到具体公司的订单上——「沾边」和「受益」之间，隔着一条产业链的距离。"}, "source": "上市公司公告 · 9月9日"}, {"badge": "回购", "headline": "一日四家公告回购：鱼跃2-4亿、德业1-2亿、恒玄0.5-1亿、三鑫0.2-0.4亿", "code": "A股", "brief": "9月9日多家公司同日公告回购：鱼跃医疗拟2-4亿元回购、德业股份实控人提议1-2亿元回购、恒玄科技实控人提议5000万-1亿元回购、三鑫医疗拟2000万-4000万元回购，多用于股权激励、员工持股或可转债转股。", "analysis": {"真实意图": "一天之内至少4家公司公告回购，集中在医疗器械、家电、半导体、医药——产业资本真金白银买自家股票，多数用于激励与员工持股。这个位置愿意掏钱，说明管理层认为股价低于内在价值。", "话语权分析": "回购潮通常出现在市场情绪冰点附近：老板比散户更懂自家公司值多少钱，也更会用回购加激励把员工利益绑上船。但回购不等于上涨——要区分「注销式」（减少股本、真回报股东）和「激励式」（发给自家人、锁定期长）。", "中道提醒": "回购是底部信号之一，不是唯一信号。别把「公司回购」当「马上要涨」，把它当产业资本在给估值托底的参考。真正见底，往往是回购、业绩、情绪三者共振之时。"}, "source": "证券时报 · 金融界 · 9月9日"}], "深圳": [{"headline": "深圳赴香港发行40亿元离岸人民币地方政府债券：连续第六年，认购倍数超9倍", "brief": "深圳市政府9月8日在香港发行2026年离岸人民币地方政府债券40亿元：10年期一般债券15亿元（利率1.81%）、5年期低碳城市主题绿色债券25亿元（利率1.51%），资金主要投向地铁等项目。簿记获71个账户认购、订单倍数超9倍，为连续第六年赴港发债。", "source": "新华社 · 深圳市财政局 · 9月9日"}, {"headline": "「深圳-香港-广州」创新集群蝉联WIPO全球创新指数榜首：连续两年登顶", "brief": "WIPO发布的《2026年全球创新指数》显示，「深圳-香港-广州」创新集群蝉联全球第一，深圳在PCT国际专利申请量等核心指标中占据绝对权重，连续两年登顶。粤港澳大湾区的创新浓度，再次得到国际权威榜单确认。", "source": "央视新闻 · WIPO · 9月8日"}, {"headline": "光博会+集成电路创新展+电子展今日宝安开幕：32万平米、5000余家企业三展联动", "brief": "第27届中国国际光电博览会（CIOE）联合IICIE国际集成电路创新博览会、elexcon深圳国际电子展9月9-11日在深圳国际会展中心（宝安）同期举行，总展览面积32万平方米，汇聚5000余家国内外企业，覆盖光电、芯片、电子全产业链。", "source": "深圳新闻网 · 9月9日"}], "定锚": {"quote": "没有调查，就没有发言权。", "sub": "今天是2026年9月9日，毛泽东逝世整整50年。清晨的毛主席纪念堂前，白发老人和「90后」「00后」排在同一条长队里——50年过去，人民还在用自己的方式记着他。\n\n（今日特例：不搬老典故，用毛主席留下的尺子，量一量今天的新闻。）\n\n美伊互袭升级，用《矛盾论》量：掀开每天的袭船战报，主要矛盾始终是「谁能定义霍尔木兹的规则」——抓不住主要矛盾，就被噪音牵着走。\n\n特朗普地图惹20国，用统一战线的逻辑量：谁的朋友、谁的敌人、谁是可以团结的中间派——地图画不出人心，画得越大，人心越散。\n\n加拿大反制关税、12国限制以色列定居点贸易，用《实践论》量：嘴上说的不算数，看行动、看商业手段——实践，才是检验立场的唯一标准。\n\n上海生娃不花钱、CPI回暖、平陆运河通航，用「为人民服务」量：政策好不好，看老百姓的账本宽不宽。\n\n他说过：「外因是变化的条件，内因是变化的根据。」世界再乱，乱不到替你决定命运的程度——真正决定你处境的，永远是你的内因：本事、判断、定力。\n\n50年过去，他留下的不是神坛，是方法：抓主要矛盾、实事求是、把朋友搞得多多的。这三把尺子，今天能量新闻，明天能量你的人生。怀念伟人最好的方式，是学会用他的脑子想问题。\n\n（明日恢复老典故栏目。）", "actions": ["今天起，遇事先问一句：这件事的主要矛盾是什么？次要噪音先放下", "转帖评论前先调查：信源核了吗？没有调查就没有发言权", "看人看事看本质：谁是真朋友、谁是真对手、谁是可以团结的中间派——把朋友搞得多多的"]}};

  html += '</div></section>';

  // 深圳在地
  html += '<section class="section fade-in '+delays[4]+'"><div class="section-title foldable"><span class="section-icon">🏙️</span>深圳在地<span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.深圳||[])) {
    html += '<div class="card"><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 每日定锚
  const a = data.定锚||{};
  html += '<section class="section fade-in"><div class="section-title"><span class="section-icon">🪦</span>每日定锚</div><div class="tombstone"><div class="tombstone-label">墓 志 铭</div><div class="tombstone-quote">'+(a.quote||'')+'</div><div class="tombstone-sub">'+(a.sub||'').replace(/\n/g,'<br>')+'</div><div class="tombstone-divider"></div><div class="tombstone-actions">';
  const nums = ['一','二','三','四','五'];
  for(let i=0;i<(a.actions||[]).length;i++) {
    html += '<div class="tombstone-action"><span class="tombstone-action-num">'+nums[i]+'</span><span>'+a.actions[i]+'</span></div>';
  }
  html += '</div></div></section>';

  document.getElementById('contentSections').innerHTML = html;

  // Click: fold sections / expand cards / expand hot items
  document.addEventListener('click', function(e) {
    const fold = e.target.closest('.foldable');
    if(fold) {
      fold.classList.toggle('collapsed');
      const body = fold.closest('section').querySelector('.fold-body');
      if(body) body.style.display = body.style.display==='none'?'block':'none';
      return;
    }
    const card = e.target.closest('.card');
    if(card) {
      const an = card.querySelector('.card-analysis');
      if(an) an.style.display = an.style.display==='none'?'block':'none';
      return;
    }
    const hot = e.target.closest('.hot-item');
    if(hot) {
      const d = hot.querySelector('.hot-detail');
      if(d) d.style.display = d.style.display==='block'?'none':'block';
      hot.classList.toggle('open', d && d.style.display==='block');
    }
  });

  // Pull to refresh
  let ts = 0;
  const ind = document.createElement('div');
  ind.className = 'pull-indicator';
  ind.textContent = '↓ 下拉刷新';
  document.querySelector('.app-container').prepend(ind);
  document.addEventListener('touchstart', e => { ts = e.touches[0].clientY; });
  document.addEventListener('touchmove', e => {
    if(window.scrollY===0 && e.touches[0].clientY-ts>60) {
      ind.style.opacity = '1'; ind.textContent = '释放刷新';
    }
  });
  document.addEventListener('touchend', () => {
    if(ind.style.opacity==='1') { ind.textContent='正在刷新...'; setTimeout(()=>location.reload(),500); }
    ind.style.opacity = '0';
  });

})();
</script>
</body>
</html>
