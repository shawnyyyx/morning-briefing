<style>

  .hot-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; margin-top: 2px; }
  .hot-level { font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.05em; }

  // Inline data - no fetch needed
  const data = {"date": "2026-09-18", "greeting": "早上好，小弟", "weather": "深圳 · 晴间多云 · 26~32℃", "五洲": [{"洲": "亚洲", "emoji": "🌏", "items": [{"rank": 1, "title": "日本首相高市早苗首次改组内阁：经济团队保留，维新会议员首次入阁", "level": "沸", "heat": "共同社 · 路透社", "brief": "9月17日，日本首相高市早苗改组内阁，这是她2025年10月上台以来的首次内阁改组。经济相关核心成员留任，释放政策连续性信号；日本维新会议员首次进入内阁。改组的时点被普遍解读为在央行议息前的政治布局。", "note": "看内阁改组别只看换了谁，要看没换谁——留任的才是真定调的人。维新会首次入阁，说明联合执政的价码在往上走。"}, {"rank": 2, "title": "韩国与中亚五国举行首届领导人峰会，建立关键矿产伙伴关系", "level": "热", "heat": "韩联社", "brief": "韩国与中亚国家在首尔举行首次领导人峰会，签署关键矿产供应链合作协议。韩国作为全球半导体与电池制造大国，原材料高度依赖进口，此举意在分散供应链风险。", "note": "半导体吃的是矿，不是代码。谁在锁矿，谁就在锁未来十年的产能——韩国这步棋，走的是十年后的事。"}, {"rank": 3, "title": "越南警告2030年或出现14吉瓦电力缺口：LNG项目进度滞后", "level": "新", "heat": "越南政府网 · VietnamNet", "brief": "越南政府警告，若液化天然气（LNG）发电项目继续滞后，到2030年可能出现约14吉瓦的电力缺口，直接影响制造业产能。越南近年承接大量电子与纺织产能，用电需求快速上升。", "note": "接得住订单，接不住电——这是所有承接产业转移国家都要过的关。缺电不是投资问题，是基建的时间差问题。"}]}, {"洲": "欧洲", "emoji": "🌍", "items": [{"rank": 1, "title": "英国8月CPI升至3.1%创五个月新高，央行连续第六次按兵不动：市场押注11月或12月加息", "level": "沸", "heat": "ONS · 英国央行", "brief": "英国8月消费者物价指数从7月的2.9%升至3.1%，创五个月新高，主因是加油站价格与机票价格上涨（伊朗冲突持续推高燃料成本）。英国央行9月17日连续第六次会议维持基准利率3.75%不变，多数委员希望先看到更多「二次效应」证据。金融市场共识是利率将在11月或12月其中一次会议上调。值得注意的是，核心通胀保持相对稳定，显示能源冲击尚未全面扩散。", "note": "通胀3.1%，利率3.75%，实际利率只有0.85%——存款没跑输，工资却跑输了。真正的压力不在CPI这个数字上，在「涨的都是必需品、涨薪的只有一部分人」这件事上。"}, {"rank": 2, "title": "英国推出3000万英镑「人民电力」社区能源基金：让社区自己发电、自己定价", "level": "热", "heat": "GOV.UK · 卫报", "brief": "英国政府9月17日启动「人民电力」（People's Power）基金，投入近3000万英镑支持社区自建清洁能源项目，覆盖屋顶光伏、社区储能、区域供热网络与微型水电，申请主体为社区利益会社、地方政府、教区议会等。大曼彻斯特市长伯纳姆在《卫报》撰文表示，其中部分资金将用于扩大本地清洁能源资产，让居民真正掌握本地发电。社区项目需符合MCS认证与TrustMark质量标准，从审批到建成通常需12至24个月。", "note": "这是英国在民生账单上少见的「正面动作」：不给个人发补贴，让社区自己发电、自己定价。3000万英镑相对英国能源转型到2040年需要的5110亿英镑，只是零头，但方向对——把定价权往下放一格，比发一次补贴管用。"}, {"rank": 3, "title": "欧盟提议加拿大成为首个「准成员」，特朗普威胁加征关税：欧洲议会暗示澳新或跟进", "level": "沸", "heat": "路透社 · RNZ", "brief": "欧盟委员会主席冯德莱恩9月16日在欧洲议会发表盟情咨文，提出让加拿大成为欧盟首个「准成员」（associate member）。加拿大总理卡尼在斯特拉斯堡表示欢迎，称「欧洲和加拿大各自都强，在一起更强」，并强调不寻求建立第三个大国集团。特朗普随即称这是「可笑的」，并威胁若视为敌对行为，将对欧洲加征「非常严厉的关税」或停止多项贸易。欧洲议会议长梅措拉暗示，澳大利亚和新西兰也可能探索类似路径。", "note": "所谓「准成员」，本质是中等级别国家在找一把共同的伞。注意卡尼那句「不是要成为大国竞争对手，只是举止更好」——这话既是安抚美国，也是说给国内听。真正的看点是：当保护伞不可靠时，中等国家会不会自己造一把。"}]}, {"洲": "非洲", "emoji": "🌍", "items": [{"rank": 1, "title": "南非埃库鲁莱尼两个月发现9具女性尸体，警方疑有连环杀手：悬赏40万兰特并封锁肯普顿帕克", "level": "沸", "heat": "美联社 · 法新社", "brief": "9月17日，南非警方在约翰内斯堡以东的埃库鲁莱尼市镇Dawn Park发现两个月内第9具女性尸体。9具尸体均在该市镇发现，部分赤裸且有殴打痕迹，警方承认前8起案件存在「足以引起警觉的相似性」。警方在肯普顿帕克实施封锁并设路障，悬赏40万兰特（约2.5万美元），最大反对党民主联盟追加3.1万美元。首位受害者37岁女性于7月15日被发现，裸体且被束线带捆绑；38岁的伊丽莎白·莫塞拉科莫慢跑时失踪，9月12日被发现遇害。联合国数据显示，南非每三名女性就有一人一生中经历过身体或性暴力。", "note": "南非的高谋杀率不是新闻，但这次能成为新闻，是因为受害者是「正在慢跑的中产女性」。同样死于暴力，能被看见和不能被看见的区别，本身就是最大的社会问题。"}, {"rank": 2, "title": "尼日利亚翁多州私酿酒精中毒死亡升至48人：确诊182例，波及两个地方政府区", "level": "热", "heat": "新华社 · 翁多州政府", "brief": "尼日利亚翁多州卫生专员通报，因饮用当地私酿酒精饮品疑致甲醇中毒，死亡人数已升至48人，约182例确诊病例在地方医疗机构报告，疑似病例仍在Odigbo与Irele两个地方政府区扩散。", "note": "喝到假酒致死，从来不是「个人贪便宜」的问题，是监管和收入共同把人逼到了那条路上。公共卫生的底线，是能不能让人喝上便宜又安全的东西。"}, {"rank": 3, "title": "南非总统拉马福萨因身体不适暂停公开活动，副总统同期也在恢复期", "level": "热", "heat": "南非总统府 · 央视新闻", "brief": "南非总统府9月16日声明，拉马福萨因身体不适暂停参加公开活动，遵医嘱休息恢复。他9月14日结束在印度举行的金砖国家领导人会晤行程返回南非。此行他已在金砖峰会上强调「金砖不是反对任何集团」。同期，副总统马沙蒂莱表示他此前接受了一项小型医疗手术，正在逐步恢复，休养期间以线上方式参与部分议会与公务。总统府没有透露拉马福萨身体不适的具体情况与恢复时间，仅表示已尽可能安排内阁部长代其出席原定活动。", "note": "一国的总统和副总统同时在「恢复期」，在管理上就是一件事：决策链上少了两个最终拍板的人。政策不会停，但会变慢——而南非此刻正需要快的回应。"}]}, {"洲": "美洲", "emoji": "🌎", "items": [{"rank": 1, "title": "美国30年期房贷利率升至6.95%，创19个月新高", "level": "沸", "heat": "美国媒体 · 房地美", "brief": "美国30年期固定房贷利率升至6.95%，为19个月以来最高。此前美联储完成新一轮加息，市场对后续利率路径的分歧加大。高房贷利率直接压制购房需求与换房意愿。", "note": "利率每上一个台阶，锁死的不只是买房的人，还有那些「想换工作但不敢换」的人——房子卖不掉，人就被钉在原地。加息最狠的地方，是它冻住的是流动性，不是价格。"}, {"rank": 2, "title": "美国批准向沙特出售48架F-35战斗机，总价243亿美元", "level": "热", "heat": "美国国务院", "brief": "美国国务院9月17日宣布，已批准向沙特阿拉伯出售48架F-35战斗机，交易总额约243亿美元。国务院称此交易将推进美国外交与安全目标，不会打破地区军事平衡，也不需要增派美军人员。", "note": "一笔243亿美元的军火订单，附带的是几十年的维护、升级与培训绑定。卖飞机的人从来不只是卖飞机——卖的是之后二十年的依赖关系。"}, {"rank": 3, "title": "美国制裁古巴镍矿与军工企业11个实体；联合国批准阿巴斯视频讲话，美国连续第二年拒签巴方代表团", "level": "热", "heat": "路透社 · 联合国", "brief": "美国国务卿鲁比奥宣布制裁11个与古巴镍矿开采及军事发展项目相关的实体和个人，指其威胁美国国家安全，同时批评古巴「政权精英囤积资源、普通民众面临停电和食品短缺」。另，在美国连续第二年拒绝向巴勒斯坦代表团发放签证后，联合国大会9月17日通过决议，允许巴勒斯坦总统阿巴斯以预录视频方式在高级别辩论中发言。", "note": "不给签证，就改成录像发言——制度是被逼出来的。制裁的清单越拉越长，被制裁对象的表达渠道反而越绕越远：堵不住的那部分，就会从别的地方冒出来。"}]}, {"洲": "大洋洲", "emoji": "🌏", "items": [{"rank": 1, "title": "澳大利亚收紧学生与背包客签证：净移民目标压至22.5万人", "level": "沸", "heat": "ABC · 澳洲内政部", "brief": "澳大利亚政府9月17日宣布收紧学生签证与打工度假签证，重点打击逾期滞留，将净移民目标压降至22.5万人。政策包括收紧临时移民的签证转换规则，并禁止留学生的配偶及子女赴澳陪读。", "note": "留学签证从「教育出口」变回「签证管理」，说明澳洲真正要管的是房租和基础设施的压力，不是学费收入。但把配偶子女挡在门外，代价由谁承担，这笔账要算清。"}, {"rank": 2, "title": "新西兰二季度GDP仅增长0.2%：建筑业与出口顶住全球燃料冲击", "level": "热", "heat": "Stats NZ", "brief": "新西兰统计局数据显示，2026年二季度GDP环比增长0.2%，建筑业与出口抵消了全球燃料价格上涨带来的压力。同期新西兰通胀与就业数据表现分化，央行9月货币政策声明维持观望。", "note": "0.2%这个数字最难解读：不是衰退，但也谈不上增长，属于「勉强站着」。小国经济最怕的就是这种状态——外部冲击一来，没有缓冲带。"}, {"rank": 3, "title": "欧洲议会议长暗示澳新或成欧盟「准成员」；新西兰超市拆分战升级，Foodstuffs 称会推高食品价格", "level": "热", "heat": "RNZ · NBR", "brief": "欧洲议会议长梅措拉在接受采访时暗示，与欧盟已有贸易协定的澳大利亚和新西兰可能探索类似加拿大的「准成员」路径，称「在这样不确定的时期，有朋友很重要」。新西兰国内则围绕超市改革激烈交锋：国家党计划拆分 Foodstuffs（New World、Pak'nSave 母公司），Foodstuffs 回应称拆分将推高食品价格，工党则主张立法禁止必需品价格欺诈。", "note": "这两件事其实是一件事的两端：对外找伞，对内压价。超市拆不拆，本质是问「谁在食品链条上拿走了最多的那一段」——这个问题每个国家都在问，答案各不相同。"}]}], "风向": [{"tag": "航道停摆", "tagType": "question", "headline": "【9月18日】曼德海峡航运近乎停摆：也门冲突升级，全球10%的海运要道被掐住了", "brief": "也门西部沿海冲突升级，胡塞武装夺取沿海关键阵地，导致曼德海峡（Bab al-Mandeb）航运几近停滞，船只被迫绕行非洲好望角。该海峡承担全球约10%的海运贸易量。胡塞领导人阿卜杜勒-马利克·胡塞9月17日否认有关其袭击伊斯兰圣城麦加的说法，称这是「捏造与虚假信息」，并称该指控被用来为「强加于也门的军事措施」动员支持。同期胡塞方面称沙特一天内发动37次空袭。此前，霍尔木兹海峡方向已因美伊冲突、沙特关闭陆上备用管道而高度紧张——全球两大能源咽喉同时吃紧。", "analysis": {"主要矛盾": "表面矛盾是也门内战与沙特空袭，根本矛盾是全球能源与货物的「通道安全」正在被局部战争重新定价。霍尔木兹与曼德海峡，一个是油的咽喉、一个是货的咽喉，如今同时吃紧。通道一紧，全世界的运费、保险费、交货周期都会跟着重算——这条链的起点在红海，终点在每个国家的物价指数里。", "战略态势": "胡塞在打一场典型的非对称消耗战：不去正面争夺海空控制权，而是用低成本的袭扰能力，逼着高价值的商船和全球贸易自己绕路。绕行好望角，航程多出几千海里、多烧几天油、多付一大笔保险——这笔钱不用胡塞掏。这就是「你打你的，我打我的」在海上的翻版：我不赢你，我让你赢得很贵。", "敌友之辨": "受影响最大的是欧洲和亚洲的进口国，而不是交战各方。红海航线的货，主力是欧洲的工业品和亚洲的能源与零售商品。压力上来之后，最容易被推到台前的是「谁能出面让航道复通」——而目前没有一个国家有能力同时跟胡塞、沙特、伊朗三方都说上话。这才是真正让人不安的地方：出问题的要道，找不到一个有权威的调解人。", "实事求是": "判断这条新闻是「阶段性扰动」还是「长期格局变化」，别猜立场，看三个可验证的指标：一是曼德海峡的日通行船舶数量能否回到正常水位；二是绕行好望角的运费溢价是否从「暂时加价」变成「合同里的常态条款」；三是欧洲零售端的库存周转天数。第一条看军事，后两条看商业——商业数据一旦固化，就说明市场已经接受了「这条路长期不安全」的定价。"}, "source": "新华社 · 路透社 · 英国海上贸易行动办公室（UKMTO） · 9月17-18日"}, {"tag": "账单 vs 药方", "tagType": "question", "headline": "【9月18日】英国8月通胀3.1%创五个月新高，央行第六次不敢动：同一天，政府掏3000万英镑让社区自己发电", "brief": "英国8月CPI从2.9%升至3.1%，创五个月新高，加油站价格与机票涨价是主因，背后是伊朗冲突持续推高燃料成本；核心通胀保持相对稳定。英国央行9月17日连续第六次会议维持利率3.75%不变，多数委员希望先看到能源冲击是否产生持久的「二次效应」，市场共识是11月或12月加息。同一天，英国政府启动近3000万英镑的「人民电力」基金，支持社区自建光伏、储能与区域供热，让社区自己发电、自己定价。而英国家庭的实际感受是：能源价格上限10月再涨60英镑、平均房价是收入中位数的7倍（1997年约3.5倍）、冻结税收起征点让4万英镑收入者每年多缴约696英镑；一份追踪指标显示，英国宏观稳定度77分、家庭生活水平仅39分。", "analysis": {"主要矛盾": "这一天英国同时出现了「账单」和「药方」，但两者的体量完全不成比例：账单是每个家庭10月起多付60英镑能源费、4万英镑收入者一年多缴696英镑税，药方是3000万英镑分给全国社区。用中国的老话说，这是「小勺子舀大锅」。真正的矛盾不在通胀数字，在于——涨价的是刚需（能源、食品、住房），能涨薪的只有一部分人，而政策的着力点全在「等待二次效应的证据」上。", "战略态势": "央行的「按兵不动」是一种典型的守势选择：它不敢降息（通胀还在目标之上），也不愿加息（劳动力市场正在降温）。这种犹豫本身会延长痛苦——因为代价不是由央行承担，是由每一个背着浮动利率贷款、每个月算着账单的家庭承担。拖延对决策者成本最低，对普通人成本最高，这是所有「观望窗口」的共同特征。", "敌友之辨": "「人民电力」这个动作值得单独看：不给个人发补贴，而是把发电和定价的权力往社区、往地方下放一格。它背后的判断是——补贴是一次性的，定价权是长期的；发钱能让选票满意，放权才能让账单下来。但对比英国能源转型到2040年所需的5110亿英镑投入，3000万英镑只是零头。所以这条新闻真正的信息不是「英国做对了」，而是「英国知道问题在定价权上，却只能先做很小的那一步」。", "实事求是": "把这条新闻跟三天前那期接起来看，逻辑就完整了：9月15日苏格兰、威尔士、北爱同台签备忘录，伦敦的回答是「比起宪法辩论，更关注降低生活成本」。今天这份CPI和这份基金，就是对那句回答的检验。检验的标准不是政府说了什么，是两组数字：10月能源账单会不会真的涨60英镑，以及11月或12月央行会不会真的加息。前者决定家庭体感，后者决定抵押贷款。政客的语言可以绕，数字不能。"}, "source": "ONS · 英国央行 · GOV.UK · 卫报 · SalaryWise 追踪 · 9月17-18日"}], "热搜": [{"text": "#九一八事变95周年#", "heat": "沸", "manipulated": false}, {"text": "#曝85花和老公已离婚#", "heat": "沸", "manipulated": true}, {"text": "#国产工业母机实现硬核突破#", "heat": "沸", "manipulated": false}, {"text": "#刘亦菲宝格丽合影裁掉越南艺人#", "heat": "沸", "manipulated": false}, {"text": "#广电总局机顶盒功能将内置电视机#", "heat": "热", "manipulated": false}, {"text": "#井柏然早春晴朗收官#", "heat": "热", "manipulated": true}, {"text": "#王鹤棣刘耀文双人蹦极#", "heat": "热", "manipulated": true}, {"text": "#国家文物局接收美国返还64件文物#", "heat": "热", "manipulated": false}], "A股": [{"badge": "技术授权", "headline": "英唐智控获Synaptics汽车显示芯片全球独家授权15年，许可费2000万美元", "code": "300131.SZ", "brief": "英唐智控公告，公司与Synaptics签署技术许可合作协议，获得汽车DDIC及汽车TDDI系列产品全球独家授权，授权期限15年。许可费2000万美元分三期支付，产品进入销售后按净销售额一定比例按季度支付提成费。", "analysis": {"真实意图": "这不是买设备，是买「做这件事的合法资格」——15年全球独家授权加阶梯提成，本质是把一条被卡住的产品线用授权方式接过来。国内汽车芯片企业走的这条路很典型：先拿授权确保产品能卖，再慢慢把设计和制造往自己手里收。", "话语权分析": "注意费用结构：一次性许可费2000万美元（分三期）＋按净销售额提成。提成条款才是关键——它意味着授权方在15年里持续分走一块毛利。独家授权是好牌，但一张牌换来的定价权是双向的：你能独家卖，也要按比例交。看这类协议先问一句：15年之后，技术能力留没留下来。", "中道提醒": "「全球独家授权15年」这个表述在公告里很漂亮，但要分清「授权独家」和「技术自主」。授权是租来的房子，住得再舒服，产权不是自己的。真正值得跟踪的指标是自己团队在这15年里积累了多少可复用的设计能力。"}, "source": "上市公司公告 · 同花顺 · 9月18日"}, {"badge": "定增缩水", "headline": "金刚光伏定增方案下调：募资上限从24.31亿降至23.87亿，砍掉上海研发中心，仅保留AI智算中心与补流", "code": "300093.SZ", "brief": "金刚光伏公告调整2026年度向特定对象发行A股股票方案：募集资金总额上限由243,109.39万元下调至238,727.79万元。用途调整为仅保留北京通州区人工智能智算中心项目（一期，拟投入16.87亿元）与补充流动资金及偿还债务（7亿元），原方案中的上海办公研发中心项目（拟投入约4381.60万元）被移除。本次发行尚待审批机关批准或同意注册。", "analysis": {"真实意图": "一家光伏公司募资去建AI智算中心，这个动作本身就说明行业现状：光伏产能过剩、价格战剧烈，公司需要用「算力」这个新叙事来支撑估值。砍掉研发中心、保留智算中心，说明管理层把资金优先级押在了能讲故事的资产上，而不是长周期的技术积累上。", "话语权分析": "定增方案能调，说明发行难度在上升——通常缩水是因为认购方对价格或项目前景有异议。这里砍掉的是「研发中心」（无形资产、见效慢），留下的是「智算中心」（重资产、见效快、能贴AI标签）。看这类调整要问一句：如果AI算力真有那么好赚，为什么是光伏公司来做。", "中道提醒": "把定增从「扩产+研发」调成「算力+还债」，其中「偿还债务」占7亿，这是很实在的信号：公司现金流的压力比扩张的野心更急。看定增别只看规模，要看钱花在哪一项——还债占的比例越高，越说明经营端需要喘息。"}, "source": "上市公司公告（巨潮资讯网）· 9月18日"}, {"badge": "海外资源", "headline": "藏格矿业拟以1.71亿美元收购Kanga Potash 92%股权，钾肥资源海外布局", "code": "000408.SZ", "brief": "藏格矿业公告，全资子公司拟与都化工共同设立联合资源公司，并由其以1.71亿美元对价收购Kanga Potash 92%股权。该议案已于9月16日经董事会审议通过，交易尚需境内外监管部门审批与备案，相关协议尚未签署。", "analysis": {"真实意图": "钾肥是中国的短板资源之一，进口依赖度高。藏格矿业已经在国内盐湖钾肥上有基础，这次出海买矿，逻辑是把资源端的确定性往手里收——资源型企业真正的护城河，从来不在加工环节，在矿权。", "话语权分析": "注意交易结构：不是上市公司直接买，而是子公司与另一家企业共同设立联合资源公司去收购。这种「联合体收购」通常出于两个考虑：分摊资金压力、分散审批风险。代价是股权被稀释，未来的收益要分出去一部分。审批环节境内外都要过，这是这类海外资源收购最容易卡住的地方。", "中道提醒": "资源收购的成败不在签约，在三个时间点：审批能不能过、投产要几年、投产时钾肥价格在什么位置。钾肥价格是周期品，高位买矿、低位投产是行业里最常见的亏法。别被「1.71亿美元」的规模吸引，要看吨成本与投产时间表。"}, "source": "上市公司公告 · 同花顺 · 9月18日"}, {"badge": "回购潮", "headline": "9月18日19家公司披露回购进展，真兰仪表股东提议回购不超1.6亿元；年内877家公司已完成1124个回购方案", "code": "宏观", "brief": "9月18日，19家公司共披露19个股票回购相关进展：1家股东提议回购（真兰仪表，不超1.6亿元），3家首次披露预案，5家获股东大会通过，5家披露实施进展，5家已实施完毕。同日恒瑞医药首次回购A股33.5万股、支付1450.36万元。从年内看，已有1124个回购方案实施完毕、涉及877家公司，其中236家完成金额超亿元，顺丰控股（59.99亿元）、京东方A（57.03亿元）、宁德时代（43.86亿元）居前。", "analysis": {"真实意图": "回购潮是上市公司在用自己的钱给股价投信任票。但要看清楚一件事：股东「提议」回购和公司真金白银「完成」回购，是两件完全不同的事。前者成本几乎为零，后者要动现金。真兰仪表这条是「股东提议」，含金量要打折扣。", "话语权分析": "回购的用途决定了它的性质：用于股权激励或员工持股，是把股票从市场收回再发给团队，长期看是利益绑定；用于注销，才是真正的减少股本、提升每股价值。同样的金额，注销比激励对股东更实在。看公告要看最后那句「用于」。", "中道提醒": "年内877家公司完成1124个回购方案，这个数量说明「回购」已经成了常规动作而非特殊信号。当一件事变成常态，它的信号价值就衰减了——现在真正值得关注的是回购金额占市值比例，以及是否有大股东在回购的同时减持。前者看力度，后者看真假。"}, "source": "第一财经 · Wind数据 · 同花顺 · 9月18日"}], "深圳": [{"headline": "南科大校长薛其坤入选2026年度「引文桂冠奖」，因量子反常霍尔效应实验观测获奖", "brief": "9月17日，2026年度引文桂冠奖（Citation Laureates）名单揭晓，22位杰出科学家获奖。中国科学院院士、南方科技大学校长、清华大学教授薛其坤凭借量子反常霍尔效应的实验观测入选，这是第二次有中国内地科学家获得该奖。引文桂冠奖由科睿唯安发布，被视为诺贝尔奖的重要风向标之一。", "source": "深圳晚报 · 科睿唯安 · 9月17日"}, {"headline": "盐田港8月集装箱吞吐量首破160万标箱创开港单月新高；前8个月中欧班列（深圳）货值同比增长46%", "brief": "8月盐田港集装箱吞吐量首次突破160万标箱，创开港以来单月新高，其中出口重箱约67万标箱、同比增长13.9%。今年前8个月，中欧班列（深圳）累计开行出口班列155列、出口集装箱1.7万标箱、货值55.7亿元，分别同比增长25%、35%、46%。同期，马来西亚砂拉越州由云南大学胡凤益团队研发、华大集团协同推进的多年生稻完成首次收割，成为深圳农业科技「出海超级接口」的案例。", "source": "深圳晚报 · 深圳海关 · 9月18日"}, {"headline": "深圳文化馆新馆9月28日试运营：8.33万平方米，国内单体面积最大文化馆", "brief": "深圳文化馆新馆预计9月28日试运营，位于龙华区民治街道，总建筑面积8.33万平方米，是目前国内单体建筑面积最大的文化馆，定位「湾区中心，国内标杆」，以「文化之舟·云上艺村」为设计理念。同期，大鹏新区重大民生工程鹏坝通道进入通车倒计时。", "source": "深圳晚报 · 深圳市文化广电旅游体育局 · 9月18日"}, {"headline": "深圳中小学免费流感疫苗已到货开打；2026深圳马拉松9月20日14时启动报名；AI环卫机器人领到首批专属「身份证」", "brief": "2026年中小学免费流感疫苗已到货，各区陆续开打——自2019年起，深圳每年为所有中小学在校学生免费接种流感疫苗。2026深圳马拉松将于9月20日14时启动报名，12月6日7时正式起跑。此外，深圳人工智能环卫机器人近日领到首批专属「身份证」，实现「一机一号、一车一码」。国庆假期首日火车票9月17日开售，深圳跻身国庆热门城市TOP10。", "source": "深圳晚报 · 深圳市卫健委 · 9月18日"}], "定锚": {"quote": "「胡服骑射」：真正的自强，从承认对手有长处开始。", "sub": "《史记·赵世家》记了一件事：赵武灵王十九年，赵国北有燕、东有胡、西有林胡楼烦，中间还夹着中山国，四面受制。他决定改——让军队脱掉宽袍大袖的中原服，改穿短衣窄袖的胡人服装，学骑马射箭。\n\n消息一出，朝堂炸了。叔父公子成带头反对，托病不上朝，说这是「变古之教，易古之道」，是背弃华夏衣冠去学蛮夷。\n\n赵武灵王亲自去叔父家里劝说。他说的不是「报仇雪耻」，是一句很实在的话：衣服是为了方便做事，礼法是为了方便成事。他先在朝堂上带头穿胡服，再一层层推到军队，最后「胡服骑射」推行开来，赵国开疆拓土，成为战国后期唯一能正面与秦较量的强国。\n\n（今天9月18日，九一八事变九十五周年。）\n\n这一天最容易被总结成两句话：一句是「勿忘国耻」，一句是「报仇雪恨」。前一句对，后一句轻了。赵武灵王的启示不在这里——真正的自强，不是把对手骂一顿，是敢承认对手有值得学的东西，然后把这东西变成自己的。\n\n毛泽东在《论持久战》里讲过：武器是战争的重要因素，但不是决定的因素，决定的因素是人不是物。赵武灵王学的是铠甲和马，对手用的也是铠甲和马——真正的差别不在兵器，在他敢动内部那套「祖宗之法不可变」的观念。器物可以买，观念只能自己革。\n\n所以这一天最该问的不是「我们恨不恨」，是三个更硬的问题：对手哪一点比我们强？我们内部哪一块还在穿宽袍大袖？改的时候，谁是那个「托病不上朝」的公子成？\n\n——不悲，不喜，只问方法。", "actions": ["今天挑一个你看不上的对手或同行，老实写下他比你强的三件事——写不出来，说明还没看清", "找出自己身上那件「宽袍大袖」：哪个习惯、流程或观念早就拖累你，只因为「一直这样」而没改", "改的阻力通常来自自己人：先把自己那一层说通再往外推，赵武灵王是先在朝堂带头穿的"]}};

    for(const it of (cont.items||[])) {

      html += '<div class="hot-item"><span class="hot-rank '+rcls+'">'+it.rank+'</span><div class="hot-main"><div class="hot-title">'+it.title+'</div><div class="hot-sub">'+sub+'</div><div class="hot-detail"><span>'+it.brief+'</span><div class="hot-note">💡 '+it.note+'</div></div></div><div class="hot-meta"><span class="hot-level '+lvcls+'">'+it.level+'</span><span class="hot-heat">'+it.heat+'</span></div></div>';
    }

  }
  html += '<div class="hot-hint">点击任意一条展开「当地人在想什么」</div></section>';

  // 今日风向
  html += '<section class="section fade-in '+delays[1]+'"><div class="section-title foldable"><span class="section-icon">🔍</span>今日风向<span class="section-count">叙事解剖</span><span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.风向||[])) {
    const tc = item.tagType==='question'?'tag-question':item.tagType==='doubt'?'tag-doubt':item.tagType==='manipulated'?'tag-manipulated':'tag-trusted';
    const pref = item.tagType==='question'?'● ':item.tagType==='manipulated'?'◆ ':'';
    html += '<div class="card"><span class="card-tag '+tc+'">'+pref+item.tag+'</span><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">叙事解剖</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 国内热搜（对照镜）
  const fc = (data.热搜||[]).filter(t=>t.manipulated).length;
  html += '<section class="section fade-in '+delays[2]+'"><div class="section-title foldable"><span class="section-icon">🔥</span>国内热搜<span class="section-count">'+fc+'条可疑</span><span class="fold-arrow">▼</span></div><div class="fold-body"><div class="topic-list">';
  for(const t of (data.热搜||[])) {
    html += '<div class="topic-chip'+ (t.manipulated?' manipulated':'') +'">'+(t.manipulated?'<span class="manipulated-dot"></span>':'')+'<span>'+t.text+'</span><span class="topic-heat">'+t.heat+'</span></div>';
  }
  html += '</div><div style="margin-top:8px;font-size:0.72rem;color:var(--text-muted)">◆ 紫色标记 = 疑似人为操纵热搜<br>判别标准：话题突升陡降、无事件支撑、短期内集中出现</div></div></section>';

  // A股棋局
  html += '<section class="section fade-in '+delays[3]+'"><div class="section-title foldable"><span class="section-icon">📊</span>A股棋局<span class="section-count">今日关注</span><span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.A股||[])) {
    html += '<div class="card stock-card"><div class="card-headline"><span class="stock-badge">'+item.badge+'</span><span>'+item.headline+'</span></div>'+(item.code?'<span class="stock-code">'+item.code+'</span>':'')+'<div class="card-brief" style="margin-top:6px">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">棋局解读</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 深圳在地
  html += '<section class="section fade-in '+delays[4]+'"><div class="section-title foldable"><span class="section-icon">🏙️</span>深圳在地<span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.深圳||[])) {
    html += '<div class="card"><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 每日定锚
  const a = data.定锚||{};
  html += '<section class="section fade-in"><div class="section-title"><span class="section-icon">🪦</span>每日定锚</div><div class="tombstone"><div class="tombstone-label">墓 志 铭</div><div class="tombstone-quote">'+(a.quote||'')+'</div><div class="tombstone-sub">'+(a.sub||'').replace(/\n/g,'<br>')+'</div><div class="tombstone-divider"></div><div class="tombstone-actions">';
  const nums = ['一','二','三','四','五'];
  for(let i=0;i<(a.actions||[]).length;i++) {
    html += '<div class="tombstone-action"><span class="tombstone-action-num">'+nums[i]+'</span><span>'+a.actions[i]+'</span></div>';
  }
  html += '</div></div></section>';

  document.getElementById('contentSections').innerHTML = html;

  // Click: fold sections / expand cards / expand hot items
  document.addEventListener('click', function(e) {
    const fold = e.target.closest('.foldable');
    if(fold) {
      fold.classList.toggle('collapsed');
      const body = fold.closest('section').querySelector('.fold-body');
      if(body) body.style.display = body.style.display==='none'?'block':'none';
      return;
    }
    const card = e.target.closest('.card');
    if(card) {
      const an = card.querySelector('.card-analysis');
      if(an) an.style.display = an.style.display==='none'?'block':'none';
      return;
    }
    const hot = e.target.closest('.hot-item');
    if(hot) {
      const d = hot.querySelector('.hot-detail');
      if(d) d.style.display = d.style.display==='block'?'none':'block';
      hot.classList.toggle('open', d && d.style.display==='block');
    }
  });

  // Pull to refresh
  let ts = 0;
  const ind = document.createElement('div');
  ind.className = 'pull-indicator';
  ind.textContent = '↓ 下拉刷新';
  document.querySelector('.app-container').prepend(ind);
  document.addEventListener('touchstart', e => { ts = e.touches[0].clientY; });
  document.addEventListener('touchmove', e => {
    if(window.scrollY===0 && e.touches[0].clientY-ts>60) {
      ind.style.opacity = '1'; ind.textContent = '释放刷新';
    }
  });
  document.addEventListener('touchend', () => {
    if(ind.style.opacity==='1') { ind.textContent='正在刷新...'; setTimeout(()=>location.reload(),500); }
    ind.style.opacity = '0';
  });

})();
</script>
</body>
</html>
