<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1040">
<title>晨间看板</title>
<style>
  :root {
    --bg-deep: #1a1040;
    --bg-mid: #3d1f54;
    --bg-warm: #7a3b4a;
    --bg-sunrise: #c4623c;
    --bg-golden: #e8a850;
    --bg-cream: #f5e6d0;
    --card-bg: rgba(0, 0, 0, 0.22);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-primary: #f5e6d0;
    --text-secondary: rgba(245, 230, 208, 0.82);
    --text-muted: rgba(245, 230, 208, 0.55);
    --accent: #e8a850;
    --accent-warm: #c4623c;
    --tag-trusted: #4ade80;
    --tag-question: #fbbf24;
    --tag-doubt: #f87171;
    --tag-manipulated: #a78bfa;
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font-display);
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 18%, var(--bg-warm) 35%, var(--bg-sunrise) 52%, #9a4a30 68%, #2d1810 100%);
    background-attachment: fixed;
    min-height: 100vh; min-height: 100dvh;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px 16px;
    padding-bottom: calc(40px + var(--safe-bottom));
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.25) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .app-container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .header { text-align: center; padding: 30px 0 20px; }
  .header-date { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.15em; margin-bottom: 6px; }
  .header-greeting { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.05em; background: linear-gradient(135deg, var(--bg-golden), var(--bg-cream)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-weather { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
  .section { margin-bottom: 24px; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; padding-left: 4px; }
  .section-icon { font-size: 1.2rem; }
  .section-count { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: auto; }
  .card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; transition: transform 0.2s ease; position: relative; overflow: hidden; }
  .card:active { transform: scale(0.985); }
  .card-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 20px; margin-bottom: 8px; }
  .tag-trusted { background: rgba(74, 222, 128, 0.15); color: var(--tag-trusted); }
  .tag-question { background: rgba(251, 191, 36, 0.15); color: var(--tag-question); }
  .tag-doubt { background: rgba(248, 113, 113, 0.15); color: var(--tag-doubt); }
  .tag-manipulated { background: rgba(167, 139, 250, 0.15); color: var(--tag-manipulated); }
  .card-headline { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; }
  .card-brief { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; }
  .card-analysis { background: rgba(0, 0, 0, 0.2); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; }
  .card-analysis-label { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .card-analysis-row { display: flex; gap: 8px; margin-bottom: 4px; font-size: 0.8rem; line-height: 1.5; }
  .card-analysis-key { color: var(--text-muted); flex-shrink: 0; min-width: 52px; }
  .card-analysis-val { color: var(--text-secondary); }
  .card-meta { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; }
  .card-source { display: inline-flex; align-items: center; gap: 4px; }
  .card-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .topic-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; padding: 8px 14px; font-size: 0.82rem; color: var(--text-primary); transition: all 0.2s ease; cursor: default; }
  .topic-chip.manipulated { border-color: rgba(167, 139, 250, 0.3); background: rgba(167, 139, 250, 0.08); }
  .topic-heat { font-size: 0.68rem; color: var(--text-muted); }
  .manipulated-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-manipulated); flex-shrink: 0; }
  .topic-note { font-size: 0.68rem; color: var(--tag-manipulated); margin-top: 4px; }
  .stock-card .card-headline { display: flex; align-items: center; gap: 8px; }
  .stock-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(232, 168, 80, 0.2); color: var(--accent); letter-spacing: 0.05em; flex-shrink: 0; }
  .stock-code { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; }
  .tombstone { text-align: center; padding: 28px 20px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); position: relative; overflow: hidden; }
  .tombstone::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.08) 0%, transparent 60%); pointer-events: none; }
  .tombstone-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; }
  .tombstone-quote { font-size: 1.3rem; font-weight: 700; color: var(--bg-cream); line-height: 1.6; margin-bottom: 12px; letter-spacing: 0.05em; }
  .tombstone-sub { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
  .tombstone-actions { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }
  .tombstone-action { display: flex; align-items: flex-start; gap: 6px; text-align: left; }
  .tombstone-action-num { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .tombstone-divider { width: 40px; height: 1px; background: rgba(232, 168, 80, 0.3); margin: 12px auto; }
  .footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); padding: 30px 0 10px; }
  .footer-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 0 6px; opacity: 0.5; }
  .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }
  .delay-5 { animation-delay: 0.5s; }
  @media (min-width: 481px) { body { padding: 30px 24px; } .header-greeting { font-size: 2rem; } .card { padding: 20px; } }
  .pull-indicator { text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 8px 0; opacity: 0; transition: opacity 0.3s ease; }
  /* 五洲热搜 - 微博热搜榜样式 */
  .hot-continent { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--accent); margin: 16px 0 8px 2px; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 20px; background: rgba(232, 168, 80, 0.08); border: 1px solid rgba(232, 168, 80, 0.18); }
  .hot-continent-count { font-size: 0.65rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
  .hot-list { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; margin-bottom: 4px; }
  .hot-item { display: flex; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); cursor: pointer; transition: background 0.2s ease; }
  .hot-item:last-child { border-bottom: none; }
  .hot-item:active { background: rgba(255, 255, 255, 0.05); }
  .hot-rank { width: 30px; font-size: 1.05rem; font-weight: 800; flex-shrink: 0; line-height: 1.5; font-style: italic; }
  .hot-rank.top { color: #ff7a45; }
  .hot-rank.normal { color: var(--text-muted); }
  .hot-main { flex: 1; min-width: 0; }
  .hot-title { font-size: 0.86rem; font-weight: 500; line-height: 1.45; }
  .hot-sub { font-size: 0.74rem; color: var(--text-muted); margin-top: 3px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hot-item.open .hot-sub { display: none; }
  .hot-detail { display: none; margin-top: 8px; font-size: 0.78rem; color: var(--text-secondary); line-height: 1.6; }
  .hot-note { color: var(--accent); margin-top: 6px; font-size: 0.76rem; line-height: 1.55; }
  .hot-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; margin-top: 2px; }
  .hot-level { font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.05em; }
  .lv-boil { background: rgba(248, 113, 113, 0.18); color: #f87171; }
  .lv-hot { background: rgba(251, 146, 60, 0.18); color: #fb923c; }
  .lv-new { background: rgba(96, 165, 250, 0.18); color: #60a5fa; }
  .hot-heat { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
  /* 可折叠板块 */
  .foldable { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .fold-arrow { transition: transform 0.25s ease; font-size: 0.72rem; color: var(--text-muted); margin-left: 4px; }
  .foldable.collapsed .fold-arrow { transform: rotate(-90deg); }
  .hot-hint { font-size: 0.7rem; color: var(--text-muted); text-align: center; margin: 10px 0 2px; opacity: 0.8; }
</style>
</head>
<body>
<div class="app-container">
  <header class="header fade-in">
    <div class="header-date" id="headerDate"></div>
    <div class="header-greeting"></div>
    <div class="header-weather"></div>
  </header>
  <div id="contentSections"></div>
  <footer class="footer" id="pageFooter"></footer>
</div>

<script>
(async function() {
  // Date
  const now = new Date();
  const wd = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('headerDate').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · '+wd[now.getDay()];
  const h = now.getHours();
  document.querySelector('.header-greeting').textContent = h<9?'早上好，小弟':h<12?'上午好，小弟':h<18?'下午好，小弟':'晚上好，小弟';

  // Inline data - no fetch needed
  const data = {"date": "2026-08-16", "greeting": "早上好，小弟", "weather": "深圳 · 多云间阴天有雷阵雨 · 27~32°C（暴雨戒备中，雷雨大风+暴雨+雷电三预警生效，19-22日暴雨风险加大）", "五洲": [{"洲": "亚洲", "emoji": "🌏", "items": [{"rank": 1, "title": "印尼7.7级地震至少38死+日本千叶暴雨9死：亚洲的灾害周末", "level": "沸", "heat": "共同社", "brief": "8月16日印尼东努沙登加拉发生7.7级地震，至少38人死亡、触发海啸预警（震中距弗洛勒斯岛岸68公里、震源深度10公里）；日本千叶县13日起暴雨已致9死1失踪、浸水住宅1087栋。极端天气在亚洲三线并发。", "note": "地震、暴雨、洪水——自然不挑国家，只挑预警做得不够的地方。灾害面前，防比救便宜一万倍。"}, {"rank": 2, "title": "日本能源「去霍尔木兹化」：7月起原油进口全面绕开海峡——生活成本的幕后转向", "level": "热", "heat": "新民晚报", "brief": "日本7月起原油进口已全面来自霍尔木兹海峡以外来源地。为对冲中东冲突风险，日本正扩建陆海替代路线、开辟红海出口、扩大美洲非洲采购。但专家提醒：风险只是转移，不是消除。", "note": "日本电费一年涨了近3倍，家里账单背后是国家在跟地缘赛跑。「去霍尔木兹化」听着宏大，落到老百姓身上就是加油站和电费单。"}, {"rank": 3, "title": "韩国西江大学18万条个人信息泄露：含朴槿惠，学生密码也中招", "level": "新", "heat": "红星新闻", "brief": "西江大学确认约18万条信息因外部攻击泄露，含学生证号、手机号与密码，据信前总统朴槿惠的信息也在其中。校方已报教育部并联合网安公司处置。", "note": "大学都防不住，何况普通人？数据泄露这种事，谁也别笑谁——今天是你母校，明天可能是你的银行。"}]}, {"洲": "欧洲", "emoji": "🌍", "items": [{"rank": 1, "title": "法国青年陷「免费亚洲旅游」陷阱：帮带「手机」实为藏毒，5人泰国被捕最高终身监禁", "level": "沸", "heat": "欧洲时报", "brief": "一种叫「泰国计划」的跨国涉毒陷阱在社交网络蔓延：招聘方以免费机票住宿+零花钱，招募年轻人赴亚洲「代购手机」，返程时「顺路」带的整箱手机实为藏毒。至少5名法国青年在泰国被捕，部分亚洲国家涉毒最高可判终身监禁。", "note": "「包吃包住夏令营」式的招聘，天上掉的从来不是馅饼。天真无知的辩护在禁毒法律面前，救不了任何人。"}, {"rank": 2, "title": "欧洲野火「高警报」：德国北威州史上最大山火，英国4500万人干旱受限", "level": "热", "heat": "路透社", "brief": "欧盟委员会宣布欧洲处于「高野火警报」。德国艾弗尔地区山火致1800人撤离，为北威州史上最大；法国朗德1580公顷火场、550名消防员在扑；西班牙阿拉贡15000公顷。英国今年5波热浪，4500万人处于干旱区、2700万人限水。", "note": "欧洲的夏天从「度假季」变成了「灭火季」。冯德莱恩说卫星在帮各国测火情——科技救了火场，救不了气候。"}, {"rank": 3, "title": "法国消防员罢工：80%是兼职、时薪接近最低工资——英雄也是打工人", "level": "新", "heat": "The Local", "brief": "法国消防员本周罢工：全国80%的消防员是兼职——白天干另一份工作，接到出警通知就去救火，时薪仅略高于最低工资（虽免税）。连续野火作战下，9个工会联合号召罢工要求专业化和增资源，9月29日还有「抗议日」。", "note": "法国人感谢消防员是「英雄」，但英雄也要吃饭。让80%的英雄兼职灭火，这不是英雄主义，是预算会计。"}]}, {"洲": "非洲", "emoji": "🌍", "items": [{"rank": 1, "title": "赞比亚大选悬案：骚乱+选票遭劫后恢复计票，两派都宣布「我赢了」", "level": "沸", "heat": "新华社", "brief": "8月13日赞比亚举行总统+议会大选，870万选民。8月14日因选务人员遭袭、选票被抢、致死冲突，选委会一度暂停计票；恢复后现任总统希奇莱马与反对派蒙杜比勒都单方面宣布胜选。SADC/AU观察团呼吁冷静，等官方结果。", "note": "铜价很高，通胀很猛——赞比亚人选的不是政客，是「明天吃什么」。两个人都宣布赢了，最后还得看计票数字说话。"}, {"rank": 2, "title": "肯尼亚燃油「交叉补贴」争议：柴油用户被牺牲，汽油车主被保护", "level": "热", "heat": "Nation Africa", "brief": "肯尼亚最新燃油定价：柴油本应降19先令/升，实际只降5先令——政府把柴油的降价空间「交叉补贴」给汽油和煤油，柴油用户被剥夺了14先令的降价。肯尼亚通胀升至6.5%，而柴油是公交、农业、发电的命脉。", "note": "政客优先保护开汽油车的中产，牺牲开柴油车的运输业——「交叉补贴」四个字，写满了穷人和富人的距离。"}, {"rank": 3, "title": "中国零关税满3个月：尼日利亚对华出口月增超40%", "level": "新", "heat": "新华社", "brief": "中国5月1日起对53个非洲建交国100%税目零关税。尼日利亚数据显示：5、6月尼对华出口环比增速均超40%。尼农业部长提醒：「零关税只给机会，不给繁荣——问题是尼日利亚能出口得更好吗？」", "note": "免关税是开门，但门里能不能赚钱，看的是本国加工能力。机会和繁荣之间，隔着一整条产业链。"}]}, {"洲": "美洲", "emoji": "🌎", "items": [{"rank": 1, "title": "美国环孢子虫疫情2.2万人感染：生菜召回后现拐点，墨西哥辣椒又爆沙门氏菌", "level": "沸", "heat": "知识碎碎念", "brief": "美国环孢子虫疫情波及15州、确诊+疑似超2.2万人，517人住院、密歇根2人死亡。源头指向墨西哥生菜（泰勒农场已召回），卫生官员称「吃生菜风险已降低」。但另一波与墨西哥辣椒相关的沙门氏菌疫情已致27州345人感染，泰勒农场再召回辣椒制品。", "note": "美国的食品安全防线，一个月被墨西哥的蔬菜撕开两次。生菜刚安全，辣椒又中招——沙拉碗里的战争。"}, {"rank": 2, "title": "阿根廷新规：外国人看病要付费了——紧急情况除外", "level": "热", "heat": "LatAm Brief", "brief": "阿根廷发布第1066/2026号决议：非永久居留的外国人到国立医院接受非紧急治疗，必须出示保险或预付费用；紧急治疗仍免费。阿根廷国别风险刚创两个月新高。", "note": "对游客是提醒，对长期旅居者是账单。医疗免费的神话，在财政吃紧面前说破就破。"}, {"rank": 3, "title": "巴西通胀0.07%+失业率5.4%创12年最低：大选前难得的好消息", "level": "新", "heat": "LatAm Brief", "brief": "巴西7月通胀仅0.07%，失业率降至5.4%为2012年统计以来最低二季度值，Selic已降至14%。不过雷亚尔本周对美元贬值2.8%，资本仍在观望10月大选。", "note": "通胀和失业都在变好，但大选前的雷亚尔在发抖。数据好看 vs 信心不稳——巴西人的钱包知道答案。"}]}, {"洲": "大洋洲", "emoji": "🌏", "items": [{"rank": 1, "title": "新西兰华裔网球名将孙璐璐宣布暂别赛场：「身心消耗巨大」", "level": "沸", "heat": "新西兰天维网", "brief": "25岁的孙璐璐（Lulu Sun）通过社媒宣布暂离职业赛场。这位2024年温网黑马（资格赛一路杀到八强、淘汰郑钦文）曾排世界第39，本赛季跌至119位。她说要「重置自己，享受球场外的生活」。", "note": "从新西兰小镇到温网八强，再到「暂停」——她教给我们的不是赢，是知道什么时候该停。健康的退出，比硬撑的坚持更勇敢。"}, {"rank": 2, "title": "悉尼邦迪滩枪击案后：新州启动枪支回购，27.4万支枪将被收回", "level": "热", "heat": "新华社", "brief": "新州政府宣布11月2日启动枪支回购：约5万持证人、27.4万支枪受影响，补偿每支450-1000澳元（高价值上限1万澳元）。这是去年12月邦迪滩枪击案（16死）后收紧枪管的最新一步，新州成澳洲首个回购州。", "note": "澳洲1996年阿瑟港枪击案后的枪改全球闻名，现在新州又来一次。控枪这种事，靠的是事后流的血，防的是事前的人命。"}]}], "风向": [{"tag": "铜与选票", "tagType": "question", "headline": "【8月16日】赞比亚大选悬案：铜价高企但通胀压身，选票在骚乱和物价之间摇摆", "brief": "8月13日赞比亚大选（总统+议会），870万选民投票。8月14日因选务人员遭袭、选票遭劫、致死冲突，选委会一度暂停全国计票，恢复后现任总统希奇莱马与反对派候选人蒙杜比勒均单方面宣布胜选。SADC、非盟-东共体、大湖会议观察团联合呼吁冷静，等官方结果。赞比亚是撒哈拉以南关键铜矿生产国，希奇莱马任内完成债务重组、恢复IMF援助，但通胀与贫困仍高企。", "analysis": {"谁在操盘": "表面是两大阵营在抢票，实际是「铜价」和「物价」在抢人。赞比亚经济系于铜——铜价高企是希奇莱马的政绩底气，但通胀和贫困是蒙杜比勒的攻击弹药。双方都宣布胜选、骚乱和抢票出现，说明没有一方敢让结果完全交给计票——这就是选票政治里最危险的时刻。", "话语权归属": "「我赢了」这种提前宣布，本质是抢叙事：谁先定义「正义阵营」，谁就能在官方结果出来前动员支持者。但国际观察团很清楚——话语权最终归于计票数字。SADC要求各方「别单方面宣布、走法律渠道」，就是在跟「叙事战」抢时间。", "受益方": "短期看，任何一方都不敢在骚乱中拖延太久——稳定本身就是受益方。对中国来说，赞比亚是重要铜矿来源，政局稳定符合利益。但更大的警示是：非洲的资源型国家，都面临「资源收入与民生感受脱节」的结构性问题——这比一次大选更值得长期关注。", "中道视角": "别被「两个人都宣布赢」带节奏。中道的态度：非洲大选的看点从来不是谁口号响，而是计票敢不敢公开、输家认不认账。铜矿国的命运不是被选票决定的，是被铜价和国际资本决定的——选举只是表面仪式，资源和治理才是里子。"}, "source": "新华社 · SADC · 8月15-16日"}, {"tag": "自然的考卷", "tagType": "question", "headline": "【8月16日】东亚灾害周末：印尼7.7级地震38死、日本千叶暴雨9死、河南洪水四级响应——自然的考卷没有假期", "brief": "8月16日印尼东努沙登加拉7.7级地震至少38人死亡、触发海啸预警；日本千叶县暴雨已致9死1失踪、浸水住宅1087栋；河南受台风残余环流影响沙颍河形成2026年1号洪水，国家启动四级救灾应急响应。极端天气在东亚三线并发，正值周末。", "analysis": {"谁在操盘": "没有谁操盘——这是「操盘」一词的边界。地震是板块运动，暴雨是大气环流，洪水是地形雨量。自然的考卷不分周末、不看预报，它只管发卷。人类能做的唯一「操盘」，是预警体系、救灾响应、防灾设施——这些决定了同样的灾害死多少人。", "话语权归属": "灾害叙事里最容易出现「甩锅」：天灾变人祸的归因、救灾效率的质疑、预警是否及时。但真正的话语权在「死亡数字」手里——印尼38死、日本9死、河南响应四级，同一个周末，不同的预防水平就是不同的伤亡。", "受益方": "防灾做得好的地方受益——减少的伤亡和损失就是最大的「利润」。对中国而言，河南的四级响应和日本的气象预警显示：越是高频灾害地区，越把防灾当基建投资而非应急成本。这才是真正的「受益」逻辑。", "中道视角": "灾害常态化是气候变暖的确定性结果，但应对得好坏是人的选择。中道的态度：不渲染「末日」也不回避风险——地震暴雨会越来越多，唯一值得押注的是预警和韧性建设。天要下雨挡不住，人该做的事是让雨来了之后，损失降到最低。"}, "source": "共同社 · 中央气象台 · 央视 · 8月15-16日"}], "热搜": [{"text": "#牛来票房暴涨1000倍#", "heat": "从7726元到预测1837万", "manipulated": true}, {"text": "#旺旺最大的对手竟是糖#", "heat": "经营危机+减糖呼声", "manipulated": false}, {"text": "#旺旺二少爷回应减糖建议#", "heat": "感谢铭记在心", "manipulated": false}, {"text": "#巴萨官微误发喜报秒删#", "heat": "转会官宣翻车", "manipulated": false}, {"text": "#空枪定档8月19日#", "heat": "微博年度期待TOP10", "manipulated": true}, {"text": "#河南暴雨#", "heat": "沙颍河1号洪水", "manipulated": false}, {"text": "#男子吃过期挂面检出黄曲霉素险进ICU#", "heat": "毒性为砒霜64倍", "manipulated": false}, {"text": "#寿司郎小孩脚放饮水龙头#", "heat": "广州门店回应", "manipulated": false}], "A股": [{"badge": "周末复盘", "headline": "本周A股：科技主线强势但缩量分化，中芯华虹创纪录、长鑫稳居一哥——下周看什么", "code": "大盘观察", "brief": "本周（8.10-8.14）A股震荡分化：周一缩量普涨、周三长鑫上市满三周市值3.69万亿稳居一哥、周四缩量至2.16万亿近3000股下跌。中芯国际Q2营收首破30亿美元（+36.1%）、净利+261.7%，华虹净利+385.9%；中际旭创17亿入股中石科技引爆CPO。周四周五科技强、消费弱。", "analysis": {"真实意图": "本周的盘面讲了一个故事：资金在「业绩定价」（中芯华虹订单爆满）和「叙事定价」（CPO涨停潮、存储荒喊话）之间切换，但整体量能萎缩——说明增量资金谨慎，存量资金在做高低切换。缩量分化不是熊市信号，是换仓信号。", "话语权分析": "「中芯华虹创纪录」是硬证据，给了科技主线话语权；但2.16万亿的缩量说明这个话语权还没传导到全体资金。下周的胜负手：量能能不能回来。放量突破=科技主线延续；继续缩量=存量博弈，轮动会更快。", "中道提醒": "周日不交易，正好冷静。下周关注三点：①中报密集披露期（业绩证伪/证实）；②量能是否重回2.5万亿+；③外围（美CPI、中东、存储涨价）。别在缩量里追高，也别在科技回调里恐慌——主线没变，节奏要管。"}, "source": "上海证券报 · 东方财富 · 8月14-16日"}], "深圳": [{"headline": "深圳暴雨戒备中：雷雨大风+暴雨+雷电三预警生效，8级雷暴大风、山洪风险", "brief": "8月15日18时49分深圳市气象台发布全市雷电预警+分区雷雨大风黄色+暴雨黄色预警，全市进入暴雨戒备状态。预计自西向东出现雷雨，最大小时雨强30毫米、伴8级雷暴大风。19-22日随南风加大，雷阵雨渐趋频密、暴雨风险加大。", "source": "深圳天气 · 南方+ · 8月15-16日"}, {"headline": "大鹏发现深圳近十年首片连片海草床：200-300平方米「海底草原」填补生态空白", "brief": "深圳近十年来首次记录到连片海草床：大鹏新区大亚湾坝光白沙湾滩涂发现卵叶喜盐草群落，总面积约200-300平方米。海草床与红树林、珊瑚礁并称三大典型海洋生态系统。市政协启动「保护海草床·委员在行动」调研。", "source": "深圳新闻网 · 8月15日"}, {"headline": "乐园路海鲜季启幕：借陆丰开渔节东风，深圳人提前尝「山海味道」", "brief": "8月14日「2026深圳赋能乡村振兴社区联展联销暨乐园路海鲜季」在罗湖启幕，依托8月16日汕尾陆丰开渔节，打造「一轴五区」消费场景：乐园路老字号海鲜+陆丰帮扶农产品+非遗英歌舞。联动建行、邮储推出消费福利。", "source": "深圳新闻网 · 8月14-15日"}], "定锚": {"quote": "一部烂片因为一个「牛」字暴涨1000倍票房，赞比亚人在选票和物价之间挣扎——世界既荒诞又真实。", "sub": "《牛来》的故事很有隐喻：上映10天票房7726元，上热搜后预测1837万——人们买的不是电影，是那个「牛」字，是股民对行情的许愿。烂不可怕，可怕的是没人看见。赞比亚大选，铜价很高但通胀很猛，人们选的不是政客，是「明天吃什么」。荒诞和真实，永远是硬币的两面——热闹的东西往往没价值，沉重的东西往往没人看。", "actions": ["深圳暴雨戒备：三预警生效、8级雷暴大风，出门带伞；19-22日暴雨风险加大", "赞比亚大选结果悬而未决：两派都宣布胜选——看官方计票，别信单方喊话", "《牛来》式的热闹看看就好：流量是脉冲式的，信任是细水长流的——别把猎奇当趋势"]}};

      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 深圳在地
  html += '<section class="section fade-in '+delays[4]+'"><div class="section-title foldable"><span class="section-icon">🏙️</span>深圳在地<span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.深圳||[])) {
    html += '<div class="card"><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 每日定锚
  const a = data.定锚||{};
  html += '<section class="section fade-in"><div class="section-title"><span class="section-icon">🪦</span>每日定锚</div><div class="tombstone"><div class="tombstone-label">墓 志 铭</div><div class="tombstone-quote">'+(a.quote||'')+'</div><div class="tombstone-sub">'+(a.sub||'').replace(/\n/g,'<br>')+'</div><div class="tombstone-divider"></div><div class="tombstone-actions">';
  const nums = ['一','二','三','四','五'];
  for(let i=0;i<(a.actions||[]).length;i++) {
    html += '<div class="tombstone-action"><span class="tombstone-action-num">'+nums[i]+'</span><span>'+a.actions[i]+'</span></div>';
  }
  html += '</div></div></section>';

  document.getElementById('contentSections').innerHTML = html;

  // Click: fold sections / expand cards / expand hot items
  document.addEventListener('click', function(e) {
    const fold = e.target.closest('.foldable');
    if(fold) {
      fold.classList.toggle('collapsed');
      const body = fold.closest('section').querySelector('.fold-body');
      if(body) body.style.display = body.style.display==='none'?'block':'none';
      return;
    }
    const card = e.target.closest('.card');
    if(card) {
      const an = card.querySelector('.card-analysis');
      if(an) an.style.display = an.style.display==='none'?'block':'none';
      return;
    }
    const hot = e.target.closest('.hot-item');
    if(hot) {
      const d = hot.querySelector('.hot-detail');
      if(d) d.style.display = d.style.display==='block'?'none':'block';
      hot.classList.toggle('open', d && d.style.display==='block');
    }
  });

  // Pull to refresh
  let ts = 0;
  const ind = document.createElement('div');
  ind.className = 'pull-indicator';
  ind.textContent = '↓ 下拉刷新';
  document.querySelector('.app-container').prepend(ind);
  document.addEventListener('touchstart', e => { ts = e.touches[0].clientY; });
  document.addEventListener('touchmove', e => {
    if(window.scrollY===0 && e.touches[0].clientY-ts>60) {
      ind.style.opacity = '1'; ind.textContent = '释放刷新';
    }
  });
  document.addEventListener('touchend', () => {
    if(ind.style.opacity==='1') { ind.textContent='正在刷新...'; setTimeout(()=>location.reload(),500); }
    ind.style.opacity = '0';
  });

})();
</script>
</body>
</html>
