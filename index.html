<title>晨间看板</title>
<style>
  :root {
    --bg-deep: #1a1040;
    --bg-mid: #3d1f54;
    --bg-warm: #7a3b4a;
    --bg-sunrise: #c4623c;
    --bg-golden: #e8a850;
    --bg-cream: #f5e6d0;
    --card-bg: rgba(0, 0, 0, 0.22);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-primary: #f5e6d0;
    --text-secondary: rgba(245, 230, 208, 0.82);
    --text-muted: rgba(245, 230, 208, 0.55);
    --accent: #e8a850;
    --accent-warm: #c4623c;
    --tag-trusted: #4ade80;
    --tag-question: #fbbf24;
    --tag-doubt: #f87171;
    --tag-manipulated: #a78bfa;
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font-display);
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 18%, var(--bg-warm) 35%, var(--bg-sunrise) 52%, #9a4a30 68%, #2d1810 100%);
    background-attachment: fixed;
    min-height: 100vh; min-height: 100dvh;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px 16px;
    padding-bottom: calc(40px + var(--safe-bottom));
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.25) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .app-container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .header { text-align: center; padding: 30px 0 20px; }
  .header-date { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.15em; margin-bottom: 6px; }
  .header-greeting { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.05em; background: linear-gradient(135deg, var(--bg-golden), var(--bg-cream)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-weather { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
  .section { margin-bottom: 24px; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; padding-left: 4px; }
  .section-icon { font-size: 1.2rem; }
  .section-count { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: auto; }
  .card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; transition: transform 0.2s ease; position: relative; overflow: hidden; }
  .card:active { transform: scale(0.985); }
  .card-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 20px; margin-bottom: 8px; }
  .tag-trusted { background: rgba(74, 222, 128, 0.15); color: var(--tag-trusted); }
  .tag-question { background: rgba(251, 191, 36, 0.15); color: var(--tag-question); }
  .tag-doubt { background: rgba(248, 113, 113, 0.15); color: var(--tag-doubt); }
  .tag-manipulated { background: rgba(167, 139, 250, 0.15); color: var(--tag-manipulated); }
  .card-headline { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; }
  .card-brief { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; }
  .card-analysis { background: rgba(0, 0, 0, 0.2); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; }
  .card-analysis-label { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .card-analysis-row { display: flex; gap: 8px; margin-bottom: 4px; font-size: 0.8rem; line-height: 1.5; }
  .card-analysis-key { color: var(--text-muted); flex-shrink: 0; min-width: 52px; }
  .card-analysis-val { color: var(--text-secondary); }
  .card-meta { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; }
  .card-source { display: inline-flex; align-items: center; gap: 4px; }
  .card-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .topic-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; padding: 8px 14px; font-size: 0.82rem; color: var(--text-primary); transition: all 0.2s ease; cursor: default; }
  .topic-chip.manipulated { border-color: rgba(167, 139, 250, 0.3); background: rgba(167, 139, 250, 0.08); }
  .topic-heat { font-size: 0.68rem; color: var(--text-muted); }
  .manipulated-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-manipulated); flex-shrink: 0; }
  .topic-note { font-size: 0.68rem; color: var(--tag-manipulated); margin-top: 4px; }
  .stock-card .card-headline { display: flex; align-items: center; gap: 8px; }
  .stock-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(232, 168, 80, 0.2); color: var(--accent); letter-spacing: 0.05em; flex-shrink: 0; }
  .stock-code { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; }
  .tombstone { text-align: center; padding: 28px 20px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); position: relative; overflow: hidden; }
  .tombstone::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.08) 0%, transparent 60%); pointer-events: none; }
  .tombstone-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; }
  .tombstone-quote { font-size: 1.3rem; font-weight: 700; color: var(--bg-cream); line-height: 1.6; margin-bottom: 12px; letter-spacing: 0.05em; }
  .tombstone-sub { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
  .tombstone-actions { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }
  .tombstone-action { display: flex; align-items: flex-start; gap: 6px; text-align: left; }
  .tombstone-action-num { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .tombstone-divider { width: 40px; height: 1px; background: rgba(232, 168, 80, 0.3); margin: 12px auto; }
  .footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); padding: 30px 0 10px; }
  .footer-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 0 6px; opacity: 0.5; }
  .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }
  .delay-5 { animation-delay: 0.5s; }
  @media (min-width: 481px) { body { padding: 30px 24px; } .header-greeting { font-size: 2rem; } .card { padding: 20px; } }
  .pull-indicator { text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 8px 0; opacity: 0; transition: opacity 0.3s ease; }
</style>

<script>
(async function() {
  // Date
  const now = new Date();
  const wd = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('headerDate').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · '+wd[now.getDay()];
  const h = now.getHours();
  document.querySelector('.header-greeting').textContent = h<9?'早上好，小弟':h<12?'上午好，小弟':h<18?'下午好，小弟':'晚上好，小弟';

  // Inline data - no fetch needed
  const data = {"date": "2026-08-08", "greeting": "早上好，小弟", "weather": "深圳 · 晴天酷热 · 28~36°C（中北部38°C+，高温黄色预警，台风白海豚外围下沉）", "图景": [{"tag": "博弈收网", "tagType": "trusted", "headline": "【8月7-8日】霍尔木兹海峡协议总体框架已明确、美方称「很快达成」将解除封锁：八天博弈进入收网阶段", "brief": "8月7日，伊朗议会国安与外交政策委员会发言人表示，伊朗与阿曼已明确霍尔木兹海峡航运谅解备忘录的总体框架，最终文本将于近期公布。同日，美方官员称阿曼与伊朗「已取得进展，预计很快达成协议」，一旦宣布协议，美方将解除对伊朗港口的封锁，行动「视实际表现而定」。伊朗总统佩泽希齐扬同日强调，伊朗未在谈判中作任何让步，并否认与美国直接谈判。此前8月6日，伊朗公布海峡管理方案草案细节：禁止美以等「敌对方」船只通行，违者罚货物价值20%。", "analysis": {"谁在操盘": "伊朗的棋路很清楚：一边用阿曼做中间人谈航线坐标，一边自己公布草案划红线（禁止敌对方通行）——两手同时出。美方配合着说「很快达成」，因为这符合双方的核心利益：伊朗需要解除港口封锁恢复经济，美国需要一个体面的台阶结束这场推高油价的冲突。佩泽希齐扬那句「没作让步」是说给国内听的：谈判桌上是交易，国内政治是立场。", "话语权归属": "注意三方各说各的：伊朗说「只跟阿曼谈，美国别掺和」；美国说「我们参与了，协议一达成就解除封锁」；阿曼默不作声。三套叙事各自服务各自的受众。伊朗的叙事给国内看——「不是我在求美国」；美国的叙事给市场看——「局势在缓和，油价可以跌」。谁真谁假不重要，重要的是谁的叙事能维持到最后。", "受益方": "全球航运和石油进口国直接受益：一旦协议落地，海峡商业航运恢复，油价承压趋势延续。伊拉克也在加快找替代出口通道（叙利亚口岸重开），说明即使协议签了，各国也不会再把鸡蛋放一个篮子里。对中国来说，油价稳定利好成本端，但更大的信号是：美国愿意用解除封锁换协议——这是博弈框架在松动，不是伊朗赢了。", "中道视角": "协议框架已明确，但不等于已签署——伊朗议会还要审、最高国安委还要批。从「接近达成」到「签署生效」，每一步都可能再生变数。中道的态度：当趋势信号看（方向在缓和），不当结论押（细节会反复）。牌桌上的交易到了最后阶段，最容易被最后一手翻盘。"}, "source": "央视新闻 · 总台 · 8月7-8日"}, {"tag": "自然之力", "tagType": "question", "headline": "【8月7-8日】超强台风「白海豚」逼近华东：环流直径超1000公里、浙江舟山到福建福鼎沿海登陆在即——深圳被外围「烤」出36°C+", "brief": "8月8日早晨5时，第13号台风「白海豚」（强台风级）中心位于温州东偏南约600公里，最大风力14级（45m/s），环流直径超1000公里。中央气象台发布台风橙色预警：预计9日晚至10日晨在浙江舟山到福建福鼎一带沿海登陆（13-14级），登陆后将深入内陆、移动速度减缓，长江中下游累计雨量极大，局地单点降水具极端性（浙江东部局地超600mm）。这是有记录以来首个从日期变更线（东经180°）生成并登陆我国的台风，移动距离超7200公里。深圳方面，受其外围下沉气流影响，8-10日高温加剧至36°C+，中北部可达38°C+，高温黄色预警持续。", "analysis": {"谁在操盘": "没有谁操盘——这就是操盘这个词的边界。台风不跟你博弈，不跟你叙事，不跟你谈判。它只管来。但人类的「操盘」在防灾这边：浙江、上海处于台风前进方向右侧的危险半圆，风雨最强；各地从昨天开始升级预警、转移人员、封航停运。自然出题，人类答题。", "话语权归属": "气象预警是少数不被话语权污染的信息领域——因为台风不挑意识形态，它只挑登陆点。中央气象台用「橙色预警」「极端性降雨」「危险半圆」这些词，不是在叙事，是在保命。这时候最该听的，就是最直白的那种话。", "受益方": "防灾做得好的地方受益——这听起来是废话，但「受益」不一定只是赚钱。华东沿海如果应对得当，减少的人员伤亡和财产损失就是最大的受益。对深圳来说，外围下沉气流=高温蒸煮，空调负荷拉满，电网承压。台风登陆后如果路径偏西，深圳后续还可能迎来降雨降温——高温是前奏，不是全部。", "中道视角": "台风是自然周期的一部分，来了就应对，过了就重建。别把台风当成「灾难叙事」的素材——那是媒体的事。你是深圳人，你要做的事很简单：周末别去海边，空调别关，多喝水。自然之力面前，最好的态度是敬畏和准备，不是恐惧和抱怨。"}, "source": "中央气象台 · 中国天气网 · 深圳天气 · 8月8日"}, {"tag": "算力兑现", "tagType": "trusted", "headline": "【8月7-8日】寒武纪半年报营收净利双翻倍、市值一度破万亿：国产AI算力从「概念」走向「现金流」", "brief": "8月7日晚，寒武纪披露2026年半年报：上半年营收59.96亿元（同比+108%），归母净利23.11亿元（同比+123%），扣非净利21.66亿元（同比+137%）。云端产品线贡献99.98%营收，客户从政府智算集群切换至国内头部云厂商和大模型企业。公司同步推出限制性股票激励计划：考核目标2026年营收不低于135亿元、2026-2028累计不低于1000亿元。6月30日盘中股价创历史新高，总市值一度突破1万亿元。麦格理给予「跑赢大盘」初始评级。", "analysis": {"谁在操盘": "寒武纪的操盘手是市场，但更准确地说——是国产AI大模型对算力的真实需求。上半年深度求索、月之暗面等发布万亿参数开源大模型，国产模型全球下载量破100亿次，这些模型不是PPT上的数字，是真实跑在寒武纪芯片上的负载。营收翻倍不是奇迹，是需求端的「水量」终于漫过了供给端的「渠」。", "话语权归属": "注意激励计划的考核目标：三年累计1000亿营收。这不是画饼，这是用真金白银的股权激励绑定的业绩承诺。当一个公司敢把三年千亿写进考核，说明它对自己的订单可见度有底。市场一度给到万亿市值，麦格理给「跑赢大盘」——外资在用钱投票，不是用嘴。", "受益方": "寒武纪的供应商、生态合作伙伴、以及整个国产AI算力产业链都在受益。但最大的受益方是中国AI产业的「自主可控」叙事：从被卡脖子到能跑万亿参数大模型，这条路走了几年，现在终于有财报来背书了。当然，也要看到隐忧：上半年增速较去年同期的4348%大幅放缓，经营现金流同比下降66%——增长从「爆发」切换到「稳健」，估值逻辑也要跟着换。", "中道视角": "营收翻倍是好事，但别把「万亿市值」当常态——那是6月30日盘中一瞬间的事，不是每天都在万亿之上。中道的态度：看到兑现（营收净利双增），也看到放缓（增速从4348%降到108%）。国产算力的故事才刚刚开始兑现，后面还有产能爬坡、客户拓展、国际竞争三道关。别因为一个半年报就全仓，也别因为增速放缓就下车——看三年，不是看一天。"}, "source": "寒武纪半年报 · 中国基金报 · 上海证券报 · 8月7-8日"}], "热搜": [{"text": "#白海豚台风登陆浙江#", "heat": "2185万", "manipulated": false}, {"text": "#刘浩存红裙独舞百花奖#", "heat": "1623万", "manipulated": true}, {"text": "#林志颖儿子Kimi成年#", "heat": "1347万", "manipulated": false}, {"text": "#余华翻出史铁生35年前的信#", "heat": "1189万", "manipulated": false}, {"text": "#承欢膝下是什么梗#", "heat": "1056万", "manipulated": true}, {"text": "#微信撤回可删除提示#", "heat": "932万", "manipulated": false}, {"text": "#河南三支一扶重考#", "heat": "867万", "manipulated": false}, {"text": "#小米徐洁云回应孩go言论#", "heat": "724万", "manipulated": true}], "A股": [{"badge": "并购", "headline": "蓝盾光电拟收购岚创科技控股权：35亿市值切入光通信镀膜设备，补齐光学薄膜核心工艺短板", "code": "300862.SZ", "brief": "8月7日晚，蓝盾光电披露重大资产重组预案：拟通过发行股份（14.50元/股）+支付现金，收购苏州岚创科技控股权并配套募资。标的岚创科技是国内少数在超窄带薄膜滤光片（TFF）领域实现商业化量产的设备厂商，2026年上半年营收1.71亿元、净利1.02亿元。交易完成后，蓝盾光电将掌握磁控溅射、离子溅射等高端薄膜沉积工艺，缓解光谱分析仪、激光雷达核心元件进口依赖。股票8月10日复牌。", "analysis": {"真实意图": "35亿市值的公司，用并购切入光通信和算力基础设施上游——这是「小市值+高景气赛道」的经典打法。岚创科技上半年净利率接近60%，盈利质量极高。蓝盾光电买的不只是设备产能，是光学薄膜的自主可控能力。在国产替代大逻辑下，这种「向上游吃工艺」的并购，比横向做大的并购更有战略纵深。", "话语权分析": "「缓解进口依赖」是并购公告里的标准话术，但放在光通信和算力基础设施的大背景下，这句话的含金量不同。光模块、激光雷达的核心光学元件长期依赖进口镀膜设备——岚创科技一旦被整合进蓝盾光电，国产替代就多了一个关键拼图。", "中道提醒": "标的审计评估还没做完，交易对价未定。岚创科技上半年净利1.02亿，但能否持续这个利润率、客户集中度如何、技术壁垒多深——这些都要等重组报告书出来才能判断。并购是好事，但别在复牌当天追涨停——等方案落地再说。"}, "source": "蓝盾光电公告 · 财联社 · 8月7日"}, {"badge": "定增", "headline": "浙江世宝拟募13.94亿加码线控转向：智能驾驶核心零部件国产化再落一子", "code": "002703.SZ", "brief": "8月7日，浙江世宝披露定增预案：拟募资不超过13.94亿元，投向汽车线控转向系统产业化建设（5.62亿）、新一代智能上转系统（2.92亿）、PPK产品智能化技改（1.48亿）等五大项目及补流。项目建成后将新增乘用车线控转向（RWA）产能30万台套/年。定增对象不超过35名，锁定期6个月。同日，炬光科技也抛出10.21亿定增加码光互联核心光学元器件。", "analysis": {"真实意图": "线控转向是智能驾驶从L2到L4的刚需——方向盘和车轮之间没有机械连接，全靠电子信号。浙江世宝用14亿定增加码这个赛道，赌的是未来三年国产新能源车的线控转向渗透率从个位数跳到30%+。这是「政策+技术+需求」三重共振的赛道。", "话语权分析": "同一天，炬光科技定增10亿做光互联——两家公司，一个做汽车转向，一个做光通信，但都在做同一件事：用定增募资赌国产替代的确定性。这说明二级市场的钱正在向「硬科技产能扩张」集中，这是政策引导的结果，也是产业趋势的必然。", "中道提醒": "线控转向是大方向没错，但13.94亿定增意味着稀释现有股东权益。浙江世宝市值124亿，定增规模相当于市值的11%，不算小。锁定期只有6个月，说明发行对象不是长期战略投资者——解禁后的抛压需要关注。"}, "source": "浙江世宝公告 · 每日经济新闻 · 8月7日"}], "深圳": [{"headline": "APEC深圳倒计时100天：深圳机场暑运首月客流超580万人次，「科技游」成新名片", "brief": "8月7日，「APEC大会倒计时100天媒体采风活动」在深圳开启。今年11月深圳将主办APEC第三十三次领导人非正式会议。暑运首月（7月），深圳机场累计保障旅客超580万人次、航班起降3.9万架次，单日最高进出港人次双双「10万+」。深圳的「科技游」正在全球坐标下重塑城市印象——外籍创客的福田攻略：左手AI，右手硬件。", "source": "深圳新闻网 · 深圳特区报 · 8月7-8日"}, {"headline": "8月8日全民健身日：全市83家体育场馆免费/优惠开放，深圳4.9万个体育场地、800万健身人口", "brief": "8月8日是全国第18个全民健身日，深圳市启动仪式在大鹏新区体育中心举行。全市83家体育场馆向市民免费或优惠开放，66项赛事活动覆盖足篮乒羽网象等。深圳已建成各类体育场地4.9万个，「十分钟健身圈」持续完善，「i深圳」一键预约平台覆盖全市，常年参加体育锻炼市民超800万人。光明区同步发放百万体育消费券，最高可减200元。", "source": "深圳特区报 · 深圳新闻网 · 8月8日"}, {"headline": "台风「白海豚」外围烤出38°C+：深圳8-10日高温加剧，滨海大道沉降路段逐步恢复通行", "brief": "受台风「白海豚」外围偏北下沉气流影响，深圳8-10日晴天间多云、高温加剧，最高气温36°C以上，中北部和人口密集区38°C+，间中有局地短时强雷雨和轻微灰霾。滨海大道西行沙河立交段沉降抢修进展：8月6日14时20分左侧2条主车道恢复通行，右侧3车道仍封闭施工。全市高温黄色预警持续。", "source": "深圳天气 · 深圳交警 · 南方都市报 · 8月7-8日"}], "定锚": {"quote": "霍尔木兹海峡谈了八天终于要签协议了——原来所有放话都是为了最后这一下。台风「白海豚」横跨太平洋7200公里来敲门，深圳人被外围烤出38°C。寒武纪半年报翻倍，国产算力终于不是PPT了。", "sub": "今天三件事放在一起看：海峡协议收网，说明博弈到最后比的不是谁嗓门大，是谁更需要台阶——美伊都需要，所以协议能成。台风来了，自然不管你什么叙事，它只管来——应对得当就是赢。寒武纪营收翻倍，市值一度破万亿，但增速从4348%降到108%——兑现期来了，故事换成了财报，这才是真正的考验开始。", "actions": ["海峡协议总体框架已明确、美方称「很快达成」：方向在缓和，别追消息押注——协议从签署到生效还有变数", "台风白海豚9-10日登陆浙闽：深圳周末高温38°C+，别去海边、注意防暑；华东方向出行全部暂停", "寒武纪半年报翻倍+三年千亿考核目标：国产算力进入兑现期，关注AI产业链确定性，但别因一份季报就重仓"]}};

    html += '<div class="topic-chip'+ (t.manipulated?' manipulated':'') +'">'+(t.manipulated?'<span class="manipulated-dot"></span>':'')+'<span>'+t.text+'</span><span class="topic-heat">'+t.heat+'</span></div>';
  }
  html += '</div><div style="margin-top:8px;font-size:0.72rem;color:var(--text-muted)">◆ 紫色标记 = 疑似人为操纵热搜<br>判别标准：话题突升陡降、无事件支撑、短期内集中出现</div></section>';

  // A股棋局
  html += '<section class="section fade-in '+delays[2]+'"><div class="section-title"><span class="section-icon">📊</span>A股棋局<span class="section-count">今日关注</span></div>';
  for(const item of (data.A股||[])) {
    html += '<div class="card stock-card"><div class="card-headline"><span class="stock-badge">'+item.badge+'</span><span>'+item.headline+'</span></div>'+(item.code?'<span class="stock-code">'+item.code+'</span>':'')+'<div class="card-brief" style="margin-top:6px">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">棋局解读</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</section>';

  // 深圳在地
  html += '<section class="section fade-in '+delays[3]+'"><div class="section-title"><span class="section-icon">🏙️</span>深圳在地</div>';
  for(const item of (data.深圳||[])) {
    html += '<div class="card"><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</section>';

  // 每日定锚
  const a = data.定锚||{};
  html += '<section class="section fade-in '+delays[4]+'"><div class="section-title"><span class="section-icon">🪦</span>每日定锚</div><div class="tombstone"><div class="tombstone-label">墓 志 铭</div><div class="tombstone-quote">'+(a.quote||'')+'</div><div class="tombstone-sub">'+(a.sub||'').replace(/\n/g,'<br>')+'</div><div class="tombstone-divider"></div><div class="tombstone-actions">';
  const nums = ['一','二','三','四','五'];
  for(let i=0;i<(a.actions||[]).length;i++) {
    html += '<div class="tombstone-action"><span class="tombstone-action-num">'+nums[i]+'</span><span>'+a.actions[i]+'</span></div>';
  }
  html += '</div></div></section>';

  document.getElementById('contentSections').innerHTML = html;

  // Card click
  document.addEventListener('click', function(e) {
    const card = e.target.closest('.card');
    if(!card) return;
    const an = card.querySelector('.card-analysis');
    if(an) an.style.display = an.style.display==='none'?'block':'none';
  });

  // Pull to refresh
  let ts = 0;
  const ind = document.createElement('div');
  ind.className = 'pull-indicator';
  ind.textContent = '↓ 下拉刷新';
  document.querySelector('.app-container').prepend(ind);
  document.addEventListener('touchstart', e => { ts = e.touches[0].clientY; });
  document.addEventListener('touchmove', e => {
    if(window.scrollY===0 && e.touches[0].clientY-ts>60) {
      ind.style.opacity = '1'; ind.textContent = '释放刷新';
    }
  });
  document.addEventListener('touchend', () => {
    if(ind.style.opacity==='1') { ind.textContent='正在刷新...'; setTimeout(()=>location.reload(),500); }
    ind.style.opacity = '0';
  });

})();
</script>
</body>
</html>
