<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1040">
<title>晨间看板</title>
<style>
  :root {
    --bg-deep: #1a1040;
    --bg-mid: #3d1f54;
    --bg-warm: #7a3b4a;
    --bg-sunrise: #c4623c;
    --bg-golden: #e8a850;
    --bg-cream: #f5e6d0;
    --card-bg: rgba(0, 0, 0, 0.22);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-primary: #f5e6d0;
    --text-secondary: rgba(245, 230, 208, 0.82);
    --text-muted: rgba(245, 230, 208, 0.55);
    --accent: #e8a850;
    --accent-warm: #c4623c;
    --tag-trusted: #4ade80;
    --tag-question: #fbbf24;
    --tag-doubt: #f87171;
    --tag-manipulated: #a78bfa;
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font-display);
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 18%, var(--bg-warm) 35%, var(--bg-sunrise) 52%, #9a4a30 68%, #2d1810 100%);
    background-attachment: fixed;
    min-height: 100vh; min-height: 100dvh;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px 16px;
    padding-bottom: calc(40px + var(--safe-bottom));
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.25) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .app-container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .header { text-align: center; padding: 30px 0 20px; }
  .header-date { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.15em; margin-bottom: 6px; }
  .header-greeting { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.05em; background: linear-gradient(135deg, var(--bg-golden), var(--bg-cream)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-weather { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
  .section { margin-bottom: 24px; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; padding-left: 4px; }
  .section-icon { font-size: 1.2rem; }
  .section-count { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: auto; }
  .card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; transition: transform 0.2s ease; position: relative; overflow: hidden; }
  .card:active { transform: scale(0.985); }
  .card-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 20px; margin-bottom: 8px; }
  .tag-trusted { background: rgba(74, 222, 128, 0.15); color: var(--tag-trusted); }
  .tag-question { background: rgba(251, 191, 36, 0.15); color: var(--tag-question); }
  .tag-doubt { background: rgba(248, 113, 113, 0.15); color: var(--tag-doubt); }
  .tag-manipulated { background: rgba(167, 139, 250, 0.15); color: var(--tag-manipulated); }
  .card-headline { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; }
  .card-brief { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; }
  .card-analysis { background: rgba(0, 0, 0, 0.2); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; }
  .card-analysis-label { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .card-analysis-row { display: flex; gap: 8px; margin-bottom: 4px; font-size: 0.8rem; line-height: 1.5; }
  .card-analysis-key { color: var(--text-muted); flex-shrink: 0; min-width: 52px; }
  .card-analysis-val { color: var(--text-secondary); }
  .card-meta { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; }
  .card-source { display: inline-flex; align-items: center; gap: 4px; }
  .card-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .topic-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; padding: 8px 14px; font-size: 0.82rem; color: var(--text-primary); transition: all 0.2s ease; cursor: default; }
  .topic-chip.manipulated { border-color: rgba(167, 139, 250, 0.3); background: rgba(167, 139, 250, 0.08); }
  .topic-heat { font-size: 0.68rem; color: var(--text-muted); }
  .manipulated-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-manipulated); flex-shrink: 0; }
  .topic-note { font-size: 0.68rem; color: var(--tag-manipulated); margin-top: 4px; }
  .stock-card .card-headline { display: flex; align-items: center; gap: 8px; }
  .stock-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(232, 168, 80, 0.2); color: var(--accent); letter-spacing: 0.05em; flex-shrink: 0; }
  .stock-code { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; }
  .tombstone { text-align: center; padding: 28px 20px; background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); position: relative; overflow: hidden; }
  .tombstone::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(232, 168, 80, 0.08) 0%, transparent 60%); pointer-events: none; }
  .tombstone-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; }
  .tombstone-quote { font-size: 1.3rem; font-weight: 700; color: var(--bg-cream); line-height: 1.6; margin-bottom: 12px; letter-spacing: 0.05em; }
  .tombstone-sub { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
  .tombstone-actions { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }
  .tombstone-action { display: flex; align-items: flex-start; gap: 6px; text-align: left; }
  .tombstone-action-num { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .tombstone-divider { width: 40px; height: 1px; background: rgba(232, 168, 80, 0.3); margin: 12px auto; }
  .footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); padding: 30px 0 10px; }
  .footer-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 0 6px; opacity: 0.5; }
  .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }
  .delay-5 { animation-delay: 0.5s; }
  @media (min-width: 481px) { body { padding: 30px 24px; } .header-greeting { font-size: 2rem; } .card { padding: 20px; } }
  .pull-indicator { text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 8px 0; opacity: 0; transition: opacity 0.3s ease; }
  /* 五洲热搜 - 微博热搜榜样式 */
  .hot-continent { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--accent); margin: 16px 0 8px 2px; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 20px; background: rgba(232, 168, 80, 0.08); border: 1px solid rgba(232, 168, 80, 0.18); }
  .hot-continent-count { font-size: 0.65rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
  .hot-list { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; margin-bottom: 4px; }
  .hot-item { display: flex; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); cursor: pointer; transition: background 0.2s ease; }
  .hot-item:last-child { border-bottom: none; }
  .hot-item:active { background: rgba(255, 255, 255, 0.05); }
  .hot-rank { width: 30px; font-size: 1.05rem; font-weight: 800; flex-shrink: 0; line-height: 1.5; font-style: italic; }
  .hot-rank.top { color: #ff7a45; }
  .hot-rank.normal { color: var(--text-muted); }
  .hot-main { flex: 1; min-width: 0; }
  .hot-title { font-size: 0.86rem; font-weight: 500; line-height: 1.45; }
  .hot-sub { font-size: 0.74rem; color: var(--text-muted); margin-top: 3px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hot-item.open .hot-sub { display: none; }
  .hot-detail { display: none; margin-top: 8px; font-size: 0.78rem; color: var(--text-secondary); line-height: 1.6; }
  .hot-note { color: var(--accent); margin-top: 6px; font-size: 0.76rem; line-height: 1.55; }
  .hot-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; margin-top: 2px; }
  .hot-level { font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.05em; }
  .lv-boil { background: rgba(248, 113, 113, 0.18); color: #f87171; }
  .lv-hot { background: rgba(251, 146, 60, 0.18); color: #fb923c; }
  .lv-new { background: rgba(96, 165, 250, 0.18); color: #60a5fa; }
  .hot-heat { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
  /* 可折叠板块 */
  .foldable { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .fold-arrow { transition: transform 0.25s ease; font-size: 0.72rem; color: var(--text-muted); margin-left: 4px; }
  .foldable.collapsed .fold-arrow { transform: rotate(-90deg); }
  .hot-hint { font-size: 0.7rem; color: var(--text-muted); text-align: center; margin: 10px 0 2px; opacity: 0.8; }
</style>
</head>
<body>
<div class="app-container">
  <header class="header fade-in">
    <div class="header-date" id="headerDate"></div>
    <div class="header-greeting"></div>
    <div class="header-weather"></div>
  </header>
  <div id="contentSections"></div>
  <footer class="footer" id="pageFooter"></footer>
</div>

<script>
(async function() {
  // Date
  const now = new Date();
  const wd = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('headerDate').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · '+wd[now.getDay()];
  const h = now.getHours();
  document.querySelector('.header-greeting').textContent = h<9?'早上好，小弟':h<12?'上午好，小弟':h<18?'下午好，小弟':'晚上好，小弟';

  // Inline data - no fetch needed
  const data = {"date": "2026-08-15", "greeting": "早上好，小弟", "weather": "深圳 · 多云间阴天有雷阵雨 · 27~32°C（8天高温解除，周末雷雨活跃，20日后暴雨风险高）", "五洲": [{"洲": "亚洲", "emoji": "🌏", "items": [{"rank": 1, "title": "日本拉面涨到1500日元、大米创54年最大涨幅：日本人集体破防", "level": "沸", "heat": "网易号", "brief": "一碗拉面1500日元（约62元）、牛丼1200日元，5公斤大米从2000多日元飙到4000日元（创1971年以来最大涨幅），10个鸡蛋涨到300多日元。恩格尔系数升至30%（1981年来最高），上半年拉面店破产数同比增44.4%创纪录。日本年轻人在社媒直呼「受不了」，甚至感叹「必须考虑移民」。", "note": "「便宜的日本」彻底翻篇了。30年不涨的物价标签，如今换一次就是一道伤疤——日本年轻人正在经历父辈没见过的通胀。"}, {"rank": 2, "title": "韩国年轻人也在愁：青年失业率5年半最大升幅，政府承认「生计承压」", "level": "热", "heat": "首尔经济", "brief": "韩国财政部绿皮书承认经济复苏势头增强（7月出口+62.8%），但强调生计负担仍在：15-29岁青年失业率以5年半来最快速度上升，CPI涨2.8%、个人服务价格涨3.5%。李在明警告房价泡沫「再不管就要失去的几十年」，宣布给年轻购房者松绑、加税富人。", "note": "出口数据光鲜，年轻人的日子不光鲜。东亚的「经济成绩单」和「生活体感」正在撕裂。"}, {"rank": 3, "title": "日本首相被物价民怨围攻：五连发帖自证「我把控价放第一位」", "level": "新", "heat": "新浪财经", "brief": "日本首相高市早苗支持率下滑，反驳「只忙政治议程、不顾生活成本」的批评，在X上连发五条帖子列汽油补贴、免费教育、育儿补贴等纾困措施，却回避了将食品消费税降至1%的计划——即便通过也要明年4月才生效。", "note": "政治人物最慌的时候，就是开始「密集自证」的时候。物价这张考卷，比任何外交议题都难及格。"}]}, {"洲": "欧洲", "emoji": "🌍", "items": [{"rank": 1, "title": "伦敦1500名巴士司机罢工26天：驾驶室40°C「像温室」，酷夏里的底层劳动者", "level": "沸", "heat": "Evening Standard", "brief": "8月14日起伦敦1500名Arriva巴士司机开始26天11轮罢工，影响43条公交线路。工会称驾驶室温度超过40°C（只装了「空气冷却」而非空调），司机出现中暑、热射病、脱水；「厕所尊严」问题也长期被忽视。有司机说：「如果乘客知道巴士司机的真实生活，会被吓到。」", "note": "40°C的驾驶室，是伦敦夏天最真实的温度。罢工不是矫情，是热出来的——「这个夏天一年比一年热，不能再糊弄过去了」。"}, {"rank": 2, "title": "法国逮捕474名纵火嫌疑人：183人是未成年人，消防员工会号召罢工", "level": "热", "heat": "卫报", "brief": "法国内政部公布自7月以来逮捕474名涉嫌纵火者，其中183人是未成年人，约70%涉嫌故意纵火；一名15岁男孩引发的火灾导致两名消防员殉职。入夏法国野火过火约12万公顷，75个省高温橙色警报。连续作战下，9个消防员工会联合号召罢工。", "note": "高温是天灾，纵火是人祸。更讽刺的是：消防员累到要罢工，纵火的人里有一半是孩子。"}, {"rank": 3, "title": "欧洲「三高」烤出病根：高温+高通胀+高负债，超2.5万人死于高温", "level": "新", "heat": "南方周末", "brief": "欧洲被「三高」缠身：高温（今年超2.5万人因高温死亡、法西两国30万人流离失所）、高通胀（欧元区7月2.9%、能源+10%，账单寄给没有定价权的欧洲）、高负债（欧元区债务占GDP将达90.2%，远超60%安全线）。法国财长称财政状况像「火药桶」。", "note": "仗别人打、价格别人定、账单寄给欧洲——烧着的不是山火，是欧洲人的耐心。"}]}, {"洲": "非洲", "emoji": "🌍", "items": [{"rank": 1, "title": "肯尼亚98届音乐节：14.3万学生涌入小城，酒店数月前订满", "level": "沸", "heat": "Streamline Feed", "brief": "肯尼亚第98届全国音乐节在邦戈马落幕，吸引14.3万学生参加，50公里内旅馆提前数月订满，餐饮住宿收入创当地纪录。总统鲁托出席闭幕演出。主题直白：「通过艺术表达增强创意经济」——把艺术变成可税、可出口的产业。", "note": "14.3万人挤进一个县城搞音乐节——非洲版「文旅搭台、经济唱戏」。艺术对肯尼亚来说不是情怀，是出口创汇。"}, {"rank": 2, "title": "尼日利亚校园巡演：5000名学生冒雨看演出，非洲年轻人的夏天", "level": "热", "heat": "Soundcity", "brief": "Soundcity On Tour 2026尼日利亚巡演覆盖20所高校。拉各斯大学站尽管暴雨倾盆，仍吸引超5000名学生到场——Falz、Joeboy、Wande Coal等登台，25名校园新人获得上台机会。", "note": "暴雨也挡不住学生看演出——非洲年轻人的活力不在新闻里，在演唱会现场。"}, {"rank": 3, "title": "内罗毕夜空500架无人机拼出「非洲五霸」：深圳技术点亮肯尼亚", "level": "新", "heat": "中国日报", "brief": "内罗毕尼亚约体育场上空，500架中国公司制造的无人机组成非洲最大规模的灯光秀：兵马俑踢足球、肯尼亚长跑运动员、大象犀牛等「非洲五霸」、蒙内铁路、熊猫……庆祝2026中非人文交流年。", "note": "从深圳起飞的技术，点亮内罗毕的夜空——「非洲大猫」在像素里奔跑，比任何外交辞令都直观。"}]}, {"洲": "美洲", "emoji": "🌎", "items": [{"rank": 1, "title": "美国消费者信心暴跌至51：十年新低，72%的人最担心「物价太高」", "level": "沸", "heat": "路透社", "brief": "密歇根大学8月14日公布消费者信心指数初值51，创2016年以来新低。72%受访者把「物价过高」列为首要担忧、58%认为经济将恶化（均为2008年后最高）。工资跑输物价：核心PCE涨3.8% vs 时薪增速2.1%；家庭总债务17.8万亿美元、信用卡利率22.4%。", "note": "纽约商场的打折标签比秋叶还密——「只买必需品」「比去年少花20%」是2026年美国消费现场的日常。信心指数51，本质是普通人对「明天会不会更糟」的集体投票。"}, {"rank": 2, "title": "7月零售额9个月首降：美国人的钱包真的收紧了", "level": "热", "heat": "新华社", "brief": "美国7月零售额环比降0.6%，为9个月来首次下滑（6月+0.2%），创2025年5月以来最大降幅。网上商店销售降2.2%、汽车经销商降1.8%。此前公布的7月实际平均时薪同比降0.2%。", "note": "零售数据是消费的体温计。7月零售下滑+时薪跑输通胀，说明「不花钱」已经从情绪变成了行为。"}, {"rank": 3, "title": "巴西大选倒数50天：卢拉民调领先44%，但雷亚尔在贬、钱包在瘪", "level": "新", "heat": "腾讯新闻", "brief": "距10月大选约50天，卢拉支持率44%领先博索纳罗之子39%，但圣保罗民众抱怨经济下滑，雷亚尔贬至5.16兑1美元、资本外流。政府推进2028年「居民自由购电」计划，承诺电费降20-22%。", "note": "民调领先但钱包在瘪。巴西人选总统，说到底还是选物价——「自由购电降电费」是最直白的选票工程。"}]}, {"洲": "大洋洲", "emoji": "🌏", "items": [{"rank": 1, "title": "澳洲潮牌「帮帮我，我很穷」T恤卖90澳元：被骂嘲讽穷人，下架致歉", "level": "沸", "heat": "ACWA", "brief": "澳洲新锐品牌Bye Bambi推出售价90澳元的橙色T恤，印着「HELP ME I'M POOR」（帮帮我，我很穷）。正值澳洲生活成本高涨，这款衣服被批嘲讽底层、脱离现实，模特选择也遭种族争议。品牌最终下架商品并公开致歉。", "note": "在生活成本危机里卖「我很穷」T恤——这是给有钱人的幽默，不是给穷人的。时尚圈的傲慢，一次翻车全漏了。"}, {"rank": 2, "title": "新西兰男子偷捕1869只黑金鲍：判10个月居家监禁+300小时社区劳动", "level": "热", "heat": "新西兰天维网", "brief": "新西兰43岁男子用禁用的水下呼吸器非法捕捞1869只黑金鲍（个人日限额5只），大部分去壳无法放归，被没收渔船、越野车和潜水装备，判10个月居家监禁+300小时社区劳动。他辩称「准备和家人分享」。", "note": "「准备和家人分享」——你家人可真能吃。黑金鲍这种资源被捞一次，要好几年才能恢复。"}]}], "风向": [{"tag": "产能景气", "tagType": "trusted", "headline": "【8月14日】中芯国际营收首破30亿美元、净利+261.7%；华虹净利+385.9%——晶圆代工交出「历史性成绩单」", "brief": "8月13日晚，中芯国际、华虹宏力公布第二季度财报：中芯国际销售收入首破30亿美元达30.06亿（同比+36.1%），归母净利4.79亿美元（同比+261.7%）；华虹营收7.175亿美元（+26.8%）创历史新高，净利3860万美元（+385.9%）。中芯联合CEO赵海军称二季度晶圆「量价齐升」，出货量环比+14.4%、均价+5.7%，主要源于AI对配套芯片的需求。同日长鑫科技收涨4.35%、市值3.69万亿元。", "analysis": {"谁在操盘": "真正的操盘手是AI算力需求——它不是一个人在炒，是所有云厂商和模型公司一起下的订单。晶圆代工是「卖水人」：不管谁家的芯片赢了，晶圆厂都赚钱。中芯和华虹的财报就是这轮AI资本开支的「验货单」。", "话语权归属": "「历史性成绩单」这个说法本身就是话语权：当国产晶圆厂的营收和利润开始对标台积电叙事，资本市场的估值锚就从「追赶者」切换成「竞争者」。SK海力士董事长那句「明年将出现最严重的存储荒」，是在给整个产业链定调。", "受益方": "晶圆代工、设备、材料、封测整条链受益——但也要分清：中芯华虹是「真业绩」（订单驱动），而A股部分半导体小票是「蹭叙事」（情绪驱动）。受益最大的长期赢家，是能把订单变成利润的龙头，不是所有贴AI标签的股票。", "中道视角": "景气是真的，但要防「叙事放大」。AI需求推高了所有半导体的预期，可一旦某个环节的财报不及预期，杀估值时不分青红皂白。中道的态度：认景气，不认口号——中芯华虹的订单数据是硬证据，别人的PPT不是。"}, "source": "上海证券报 · 中国基金报 · 8月13-14日"}, {"tag": "钱包之夏", "tagType": "question", "headline": "【8月15日】全球普通人的钱包之夏：日本拉面1500日元、美国信心十年新低、欧洲为别人战争买单", "brief": "这个夏天，全球普通人的生活成本集体告急：日本恩格尔系数升至30%（1981年来最高）、拉面1500日元、大米54年最大涨幅；美国消费者信心51创十年新低、72%担心物价、家庭债务17.8万亿美元；欧元区通胀2.9%、能源+10%，为别人的战争买单；韩国青年失业率5年半最大升幅；澳洲连「我很穷」T恤都成了热搜。", "analysis": {"谁在操盘": "全球物价有一个共同推手：中东战争推高油价，油价传导到食品、能源、运输。各国央行和政府在打「成本推升型通胀」——这种通胀加息压不住（因为不是需求过热），补贴也填不满（因为缺口太大）。真正定价的是地缘，不是央行。", "话语权归属": "各国政客都在「甩锅」：日本首相怪历史性高油价，美国白宫怪中东冲突，欧洲怪「没有定价权」。但老百姓不关心谁的责任，只关心明天的菜价。当「通胀叙事」和「生活体感」脱节时，执政党就要付出选票代价——这是全球性的政治风险。", "受益方": "能源生产国和贸易商是少数受益方。受损方是每一个普通家庭——特别是日本这种恩格尔系数30%的国家，食品占支出的比重越高，通胀对生活的冲击越狠。对投资者来说，全球通胀环境下，现金流稳定的「抗通胀资产」相对占优。", "中道视角": "通胀是分配问题，不是算术问题——同样的油价，对美国的冲击和对日本的冲击完全不同。中道的态度：不恐慌也不侥幸。全球生活成本危机不会一夜消失（地缘未解、供应链未稳），但也不必末日叙事（就业和消费的基本盘还在）。真正的变量是油价和地缘，盯住它们，比盯住任何政客的表态都有用。"}, "source": "路透社 · 卫报 · 各媒体 · 8月14-15日"}], "热搜": [{"text": "#河南暴雨#", "heat": "沙颍河1号洪水", "manipulated": false}, {"text": "#旺旺集团面临重大经营危机#", "heat": "净利暴跌38%", "manipulated": false}, {"text": "#国乒男单无缘八强#", "heat": "连续三站低迷", "manipulated": false}, {"text": "#男子吃过期挂面检出黄曲霉素险进ICU#", "heat": "毒性为砒霜64倍", "manipulated": false}, {"text": "#寿司郎小孩脚放饮水龙头#", "heat": "广州门店回应", "manipulated": false}, {"text": "#曝王嘉尔宋雨琦恋情#", "heat": "三无爆料", "manipulated": true}, {"text": "#山西天价醋膏标价5810元#", "heat": "比飞天茅台贵", "manipulated": false}, {"text": "#披荆斩棘直播事故#", "heat": "导播误放VCR", "manipulated": true}], "A股": [{"badge": "业绩", "headline": "中芯国际Q2营收首破30亿美元、净利+261.7%；华虹+385.9%——晶圆代工「历史性成绩单」，AI需求验证", "code": "688981.SH", "brief": "8月13日晚中芯国际、华虹宏力公布Q2财报：中芯营收30.06亿美元（+36.1%）、净利4.79亿（+261.7%），均创新高；华虹营收7.175亿（+26.8%）、净利3860万美元（+385.9%）。中芯CEO称晶圆「量价齐升」：出货+14.4%、均价+5.7%，AI带动配套芯片需求。8月14日A股缩量分化：成交2.16万亿（缩4000亿+），近3000股下跌，科技强、消费弱。", "analysis": {"真实意图": "中芯华虹的财报是这轮AI资本开支的「验货单」——订单是真的、产能是满的、价格在涨。这跟长鑫上市首日那种「信仰定价」不同，晶圆厂是「业绩定价」：营收利润都翻倍，估值有支撑。", "话语权分析": "「历史性成绩单」是叙事切换的信号：国产晶圆厂开始对标台积电的估值逻辑。SK海力士董事长喊出「明年最严重的存储荒」，是在给整个存储产业链定调——涨价周期+国产替代双逻辑叠加，讲的是长期故事。", "中道提醒": "8月14日A股缩量到2.16万亿、近3000股下跌——说明情绪在退潮，资金只认有业绩的。中道的做法：认景气，不认口号。中芯华虹的订单是硬证据，但整个半导体板块估值已经透支不少——回调时龙头抗跌，蹭概念的先跌。别追高，等量能恢复。"}, "source": "上海证券报 · 东方财富 · 8月13-14日"}, {"badge": "整合", "headline": "中际旭创17亿战略入股中石科技：CPO涨停潮，AI硬件垂直整合加速", "code": "300308.SZ", "brief": "万亿市值光模块龙头中际旭创拟斥资超17亿元战略入股中石科技，中石科技一字20cm涨停，阿莱德、富信科技20cm涨停，亨通光电、剑桥科技等10cm涨停。CPO板块带动光纤、激光概念走强。同日闪迪公布长期财务模型（2028-30财年营收中高双位数增长），SK海力士称明年最严重「存储荒」。", "analysis": {"真实意图": "中际旭创入股中石科技，是光模块龙头的「向上游锁产能」——CPO（共封装光学）是下一个技术制高点，谁先锁定材料供应，谁就握有交付确定性。这是产业整合，不是概念炒作：龙头主动给产业链定价。", "话语权分析": "CPO涨停潮的本质是「强者通吃」叙事：中际旭创入股消息一出，整个板块跟涨——龙头的一句话就是板块的指挥棒。但注意，跟风涨停的小票（阿莱德、富信科技）很多只是情绪溢价，基本面未必跟得上。", "中道提醒": "AI硬件整合是真趋势，但涨停潮里有泡沫成分。8月14日大盘缩量4000亿+、近3000股下跌——情绪在退潮，追涨要付出代价。中道的做法：关注中际旭创这类「真整合」龙头的产业动作，别碰一字板情绪票。景气方向对，但节奏要稳。"}, "source": "上海证券报 · 新浪财经 · 8月14日"}], "深圳": [{"headline": "首艘国产大型邮轮「爱达·魔都号」深圳首航：4600名宾客、水门礼迎接——「大国重器」进湾区", "brief": "8月14日，首艘国产大型邮轮爱达·魔都号搭载近4600名宾客从深圳招商蛇口邮轮母港启航，开启5天4晚越南顺化之旅，以国际航海界最高礼遇「水门礼」迎接。深圳航季持续至9月16日，覆盖越南下龙湾、芽庄及韩国济州等航线，8月27日还将推出9天8晚「海丝发现之旅」。", "source": "深圳新闻网 · 8月14日"}, {"headline": "深圳8天高温预警终于解除：周末强雷雨+8级大风，20日后南海季风低压暴雨风险高", "brief": "持续8天（8月8日9时-13日22时）的高温预警信号正式解除。受海上带状雷雨云团北移影响，14日深圳局地出现强雷雨，平均气温28.4℃。周末雷雨活跃，15日有雷阵雨局部可达暴雨；展望20日后南海季风低压发展，可能出现连续降雨过程、暴雨风险高。", "source": "深圳晚报 · 深圳天气 · 8月14-15日"}, {"headline": "第四届金啤文化节「微醺地图」：30余家精酿厂牌，集章兑酒解锁罗湖夏夜", "brief": "8月14-16日第四届金啤文化节在罗湖金啤坊举行，集结30余家精酿厂牌（超三分之一首次亮相深圳）。全新「罗湖微醺地图」串联10家特色酒馆+30多处打卡点，集满7枚印章可兑多款大牌酒水，10枚可兑换活动酒币。露天舞台连续三晚音乐演出。", "source": "深圳新闻网 · 8月14日"}], "定锚": {"quote": "日本拉面1500日元、美国信心十年新低、伦敦巴士司机在40°C驾驶室罢工——这个夏天，全世界普通人的钱包都在告急。", "sub": "今天看世界，宏大叙事都缩水了，只剩一个共同主题：物价。日本恩格尔系数30年最高，美国72%的人担心物价，欧洲为别人的战争买单，韩国年轻人找不到工作，澳洲连「我很穷」T恤都成了热搜。政客们忙着甩锅地缘、外交、制裁——但老百姓只想知道明天菜价涨不涨。真正的信心从来不在股指里，在菜市场。", "actions": ["深圳8天高温解除：周末强雷雨+8级大风，出门带伞；20日后南海季风暴雨风险高", "A股缩量分化、近3000股下跌：科技强消费弱，认业绩不认口号——别追涨停情绪票", "看世界的钱包：日本拉面、美国信心、欧洲账单——物价是全球普通人共同的天气预报"]}};

  for(const item of (data.风向||[])) {
    const tc = item.tagType==='question'?'tag-question':item.tagType==='doubt'?'tag-doubt':item.tagType==='manipulated'?'tag-manipulated':'tag-trusted';
    const pref = item.tagType==='question'?'● ':item.tagType==='manipulated'?'◆ ':'';
    html += '<div class="card"><span class="card-tag '+tc+'">'+pref+item.tag+'</span><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">叙事解剖</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 国内热搜（对照镜）
  const fc = (data.热搜||[]).filter(t=>t.manipulated).length;
  html += '<section class="section fade-in '+delays[2]+'"><div class="section-title foldable"><span class="section-icon">🔥</span>国内热搜<span class="section-count">'+fc+'条可疑</span><span class="fold-arrow">▼</span></div><div class="fold-body"><div class="topic-list">';
  for(const t of (data.热搜||[])) {
    html += '<div class="topic-chip'+ (t.manipulated?' manipulated':'') +'">'+(t.manipulated?'<span class="manipulated-dot"></span>':'')+'<span>'+t.text+'</span><span class="topic-heat">'+t.heat+'</span></div>';
  }
  html += '</div><div style="margin-top:8px;font-size:0.72rem;color:var(--text-muted)">◆ 紫色标记 = 疑似人为操纵热搜<br>判别标准：话题突升陡降、无事件支撑、短期内集中出现</div></div></section>';

  // A股棋局
  html += '<section class="section fade-in '+delays[3]+'"><div class="section-title foldable"><span class="section-icon">📊</span>A股棋局<span class="section-count">今日关注</span><span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.A股||[])) {
    html += '<div class="card stock-card"><div class="card-headline"><span class="stock-badge">'+item.badge+'</span><span>'+item.headline+'</span></div>'+(item.code?'<span class="stock-code">'+item.code+'</span>':'')+'<div class="card-brief" style="margin-top:6px">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">棋局解读</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 深圳在地
  html += '<section class="section fade-in '+delays[4]+'"><div class="section-title foldable"><span class="section-icon">🏙️</span>深圳在地<span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.深圳||[])) {
    html += '<div class="card"><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 每日定锚
  const a = data.定锚||{};
  html += '<section class="section fade-in"><div class="section-title"><span class="section-icon">🪦</span>每日定锚</div><div class="tombstone"><div class="tombstone-label">墓 志 铭</div><div class="tombstone-quote">'+(a.quote||'')+'</div><div class="tombstone-sub">'+(a.sub||'').replace(/\n/g,'<br>')+'</div><div class="tombstone-divider"></div><div class="tombstone-actions">';
  const nums = ['一','二','三','四','五'];
  for(let i=0;i<(a.actions||[]).length;i++) {
    html += '<div class="tombstone-action"><span class="tombstone-action-num">'+nums[i]+'</span><span>'+a.actions[i]+'</span></div>';
  }
  html += '</div></div></section>';

  document.getElementById('contentSections').innerHTML = html;

  // Click: fold sections / expand cards / expand hot items
  document.addEventListener('click', function(e) {
    const fold = e.target.closest('.foldable');
    if(fold) {
      fold.classList.toggle('collapsed');
      const body = fold.closest('section').querySelector('.fold-body');
      if(body) body.style.display = body.style.display==='none'?'block':'none';
      return;
    }
    const card = e.target.closest('.card');
    if(card) {
      const an = card.querySelector('.card-analysis');
      if(an) an.style.display = an.style.display==='none'?'block':'none';
      return;
    }
    const hot = e.target.closest('.hot-item');
    if(hot) {
      const d = hot.querySelector('.hot-detail');
      if(d) d.style.display = d.style.display==='block'?'none':'block';
      hot.classList.toggle('open', d && d.style.display==='block');
    }
  });

  // Pull to refresh
  let ts = 0;
  const ind = document.createElement('div');
  ind.className = 'pull-indicator';
  ind.textContent = '↓ 下拉刷新';
  document.querySelector('.app-container').prepend(ind);
  document.addEventListener('touchstart', e => { ts = e.touches[0].clientY; });
  document.addEventListener('touchmove', e => {
    if(window.scrollY===0 && e.touches[0].clientY-ts>60) {
      ind.style.opacity = '1'; ind.textContent = '释放刷新';
    }
  });
  document.addEventListener('touchend', () => {
    if(ind.style.opacity==='1') { ind.textContent='正在刷新...'; setTimeout(()=>location.reload(),500); }
    ind.style.opacity = '0';
  });

})();
</script>
</body>
</html>
