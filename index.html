  const data = {"date": "2026-09-15", "greeting": "早上好，小弟", "weather": "深圳 · 多云有短时(雷)阵雨 · 26~32℃", "五洲": [{"洲": "亚洲", "emoji": "🌏", "items": [{"rank": 1, "title": "韩国电力25万亿韩元「电费预缴」计划落空：三星拒缴20万亿、SK海力士拒缴5万亿", "level": "沸", "heat": "韩国电力公社", "brief": "韩国电力向三星电子、SK海力士提出电费预缴方案：三星电子预缴约20万亿韩元、SK海力士约5万亿韩元，合计约25万亿。两家公司在完成内部评估后，已于9月11日正式告知韩国电力拒绝该方案。背景是AI数据中心与存储产线用电激增，韩国电力资金压力持续加大。", "note": "芯片厂是名副其实的电老虎。AI热潮推高的是算力，也是电费账单——这25万亿的窟窿最后谁来填，问的其实是同一件事：公共品的账，该由谁来付。"}, {"rank": 2, "title": "名古屋亚运开幕前4天住宿翻车：集装箱房漏水、2米球员腿伸不直，组委会承认「既没人力也没预算」", "level": "热", "heat": "新华社 · 多国代表团", "brief": "距离9月19日爱知·名古屋亚运会开幕仅剩4天，住宿条件持续引发多国代表团不满：集装箱式小屋床铺狭窄、房间漏水，韩国男篮球员拍视频显示洗手盆漏水漫过地板，韩国代表团称之为「有史以来最差」；印度代表团提前在国内搭起「模拟仓」适应环境。本届报名超17000人，组委会原按约15000人筹备，主席大村秀章坦言「既没有人力也没有预算」为额外参赛者安排食宿。", "note": "没有运动员村、靠邮轮加集装箱拼凑的一届亚运，是「能省则省」最直白的样本。省下的钱是财政的，暴露的问题是人心的。"}, {"rank": 3, "title": "韩国8月ICT出口599.8亿美元创月度历史新高，顺差首破400亿美元", "level": "新", "heat": "韩国产业通商部", "brief": "韩国产业通商部数据显示，8月信息通信技术（ICT）出口额599.8亿美元，创月度历史新高，连续3个月超过500亿美元；ICT贸易顺差413.7亿美元，首次突破400亿美元。增长主力来自AI存储与高带宽内存的量价齐升。", "note": "出口暴涨与拒缴电费，是同一枚硬币的两面：AI盛宴的利润归企业，成本却想摊给公用事业。谁享受红利、谁承担代价，这才是最该问的问题。"}]}, {"洲": "欧洲", "emoji": "🌍", "items": [{"rank": 1, "title": "苏格兰、威尔士、北爱三地首席大臣卡迪夫同台签备忘录：英国史上首次三地下放政府全由「脱英」政党掌舵", "level": "沸", "heat": "BBC · 路透社 · 《独立报》", "brief": "9月14日，苏格兰首席大臣斯温尼（苏格兰民族党）、威尔士首席大臣阿普·约尔韦特（威尔士党）、北爱首席部长奥尼尔（新芬党）在加的夫签署谅解备忘录，主张三地人民有权决定自身宪制前途，并呼吁英国政府「准备、规划并推动」宪政变革，新芬党主席麦克唐纳亦到场。这是英国历史上第一次三个下放地区政府全部由主张独立或爱尔兰统一的政党执掌。此前首相伯纳姆曾在议会称「若出现明确共识」可考虑公投，苏格兰方面随即正式要求商谈机制，随后伯纳姆回信重申公投「不在考虑范围内」。", "note": "三地各自的时间表差得很远：苏格兰要5年内二次公投，新芬党瞄准2030年爱尔兰统一公投，威尔士连时间表都不设。所以这份备忘录更像一份「共同焦虑声明」，而不是分家协议。"}, {"rank": 2, "title": "朴茨茅斯移民冲突：120余人乘小艇抵岸引数百人封路，救生艇志愿者被骂「叛徒」", "level": "沸", "heat": "BBC · 汉普郡警方", "brief": "约120至140名移民乘小艇抵达朴茨茅斯Eastney海滩后，数百名示威者封路，试图阻止运送移民的大巴离开，多辆警车、海警及边境部队车辆受损，少量警员受轻伤，一名42岁男子被控暴力骚乱与袭警。多佛港在此前一天已发生反移民抗议。总部位于普尔的皇家全国救生艇协会（RNLI）志愿者在社交媒体上被指为「叛徒」，其博物馆被迫关闭；警方在朴茨茅斯启用禁蒙面令，一名男子因穿罩袍规避禁令被起诉。", "note": "愤怒找错了对象。骂救生员是叛徒，不会让房租便宜一英镑，也不会让NHS少排一天队。真正在制造生活压力的那些人，从来不在海滩上。"}, {"rank": 3, "title": "英国10月起能源账单再涨：价格上限升至1723英镑/年，鸡蛋四年涨52.4%", "level": "热", "heat": "Ofgem · 英国国家统计局", "brief": "英国天然气电力市场办公室（Ofgem）价格上限10月1日起由1663英镑升至1723英镑/年（约+4%、+60英镑），燃气单价由7.33便士升至7.97便士/千瓦时（+8.7%）。自2021年1月至今，鸡蛋涨52.4%（2.10至3.20英镑/打）、奶酪涨35.6%、黄油涨35.5%、鸡肉涨33.3%、牛奶涨32.7%、面包涨32.1%；2020年的100英镑现金，如今实际购买力只剩78.54英镑（-21.5%）。平均房租1393英镑/月（同比+3.7%），65%的家庭仍挂在标准浮动费率上。", "note": "这些数字比任何一份备忘录都更能解释英国的裂痕。政客在算宪法，普通人在算鸡蛋。"}]}, {"洲": "非洲", "emoji": "🌍", "items": [{"rank": 1, "title": "南非西开普省两辆小巴与一辆SUV相撞，至少21人死亡", "level": "沸", "heat": "法新社 · 南非道路交通管理公司", "brief": "9月14日，南非西开普省开普敦东北方向的Leeu-Gamka与Prince Albert之间公路上，两辆小巴出租车与一辆SUV发生碰撞，至少21人死亡。小巴出租车是南非底层民众最主要的通勤工具，超载、车况与长途疲劳驾驶问题长期存在。", "note": "21条命，坐的是最便宜的那种通勤方式。基础设施的欠账，最后都是这样结账的。"}, {"rank": 2, "title": "南非多省发布黄色级预警：破坏性降雨、雷暴、大风、大浪同时来袭", "level": "热", "heat": "南非气象局", "brief": "南非气象局9月15日对多省发布黄色级预警：北开普东部与西开普中部卡鲁地区为4级破坏性降雨预警（可能造成道路与居民区洪水、交通严重中断）；北开普与西开普部分地区为2级强雷暴与密集雷电预警；夸祖鲁-纳塔尔为2级大风大浪预警。气象局警告可能损坏非正式住区、临时建筑，并造成电力与通信中断。", "note": "同一场天气，住水泥房和住铁皮棚是两回事。气候变化的第一道伤口，总是划在最薄的那层屋顶上。"}, {"rank": 3, "title": "刚果（金）埃博拉确诊超7200例，多省仍在持续传播", "level": "热", "heat": "刚果（金）政府 · 新华社", "brief": "刚果（金）政府9月15日数据显示，该国埃博拉确诊病例已超过7200例。尽管疫情整体呈下降趋势，多个省份仍在持续传播，此前通报的病死率超过50%。", "note": "同样是病毒，有没有疫苗、有没有医院、有没有一条能通车的路，决定了它是一条新闻，还是一场灾难。"}]}, {"洲": "美洲", "emoji": "🌎", "items": [{"rank": 1, "title": "超强厄尔尼诺逼近：机构预测概率超九成，联合国警告或新增4900万人严重缺粮", "level": "沸", "heat": "世界粮食计划署", "brief": "多家气候机构预测，2026至2027年期间赤道中东太平洋海温异常升高趋势正在加强，美国气候预测机构称2026年秋冬季出现强厄尔尼诺的概率超过九成，强度存在突破历史纪录区间的可能。世界粮食计划署评估，若影响扩大，全球高风险地区可能新增约4900万人陷入严重粮食不安全状态，集中在非洲南部、中美洲等依赖雨养农业的地区。", "note": "厄尔尼诺不直接制造饥荒，它只是把本就脆弱的地方推过临界点。有灌溉、有储备、有外汇的国家能缓冲，靠天吃饭的地方一次异常就是一年收成。"}, {"rank": 2, "title": "美联储议息：市场押注加息25个基点概率93.5%，10年期美债收益率三年来首破5%", "level": "沸", "heat": "路透社 · CME", "brief": "美联储9月15日至16日召开议息会议，将于北京时间17日凌晨公布利率决议，市场押注加息25个基点的概率已升至93.5%。美国8月CPI环比上涨0.4%、同比上涨3.4%。9月14日，基准10年期美债收益率近三年来首次盘中升破5.0%（最高触及2023年10月以来高位），30年期收于5.34%，2年期收于4.65%。", "note": "美国通胀没压住，全世界替它扛利率。加息一次，新兴市场的融资成本就往上跳一格——最典型的「我的问题，你的账单」。"}, {"rank": 3, "title": "特朗普宣布向全美成年人发放5000美元「特朗普红利」，称「一定会实施」", "level": "热", "heat": "白宫 · 美国媒体", "brief": "美国总统特朗普称，美国正收获数万亿美元的经济成果与投资，因此计划向全美所有成年人发放5000美元的「特朗普红利」，并表示该计划「一定会实施」，民主党人则希望这项计划落空。", "note": "发钱的消息从来说得很响，钱从哪来从来不写在标题里。财政赤字不会因为改叫「红利」就变成礼物。"}]}, {"洲": "大洋洲", "emoji": "🌏", "items": [{"rank": 1, "title": "澳洲东南部冷锋突袭：塔斯马尼亚9月下雪，墨尔本一天直降5℃", "level": "热", "heat": "澳洲气象局 · NewsWire", "brief": "一股冷锋扫过澳大利亚东南部：塔斯马尼亚夜间降雪，霍巴特附近威灵顿山录得零下1.2℃；墨尔本从周一19℃骤降至周二14℃、周三13℃（9月平均最高为17℃），悉尼从26℃降至18℃，堪培拉降至13℃。Thredbo Top Station录得104公里/小时阵风，塔州Maatsuyker岛达109公里/小时，气象部门对塔州发布道路与徒步警报。", "note": "上一周还热，这一周就下雪——「春天里揣着一股冬天」是澳洲人每年的必修课。来回剧烈摆，才是气候变化给普通人的真实手感。"}, {"rank": 2, "title": "亚太股市普跌：澳股ASX 200跌0.46%，日经跌0.25%，韩股跌0.43%", "level": "热", "heat": "路透社 · 澳洲证交所", "brief": "9月15日亚太市场集体走弱：澳大利亚S&P/ASX 200开盘跌0.46%，日经225跌0.25%、东证跌0.24%，韩国KOSPI跌0.43%、科斯达克跌0.33%。压力来自美债10年期收益率盘中破5%，以及布伦特原油涨至约107美元/桶。前一日美股三大指数全线收跌，费城半导体指数大跌5.86%，创7月1日以来最大单日跌幅。", "note": "油价、美债、AI减速担忧三条线同时压过来。澳洲股市跟着跌，不是因为澳洲出了什么事，而是因为它站在别人的资金链末端。"}, {"rank": 3, "title": "墨尔本快速扩张的郊区沦为「垃圾倾倒场」，维州非法倾倒危机失控", "level": "新", "heat": "澳洲媒体", "brief": "澳媒报道，随着墨尔本快速扩张的外围郊区事实上变成「倾倒场」，维多利亚州非法倾倒垃圾的危机正在失控。一名墨尔本露营者自费从州立森林清走了六车垃圾，并公开了其中发现的物品。", "note": "城市跑得比垃圾处理系统快，结果就是把郊区当垃圾场。发展与治理不同步，代价永远由住在最外面的人先付。"}]}], "风向": [{"tag": "三地联手", "tagType": "question", "headline": "【9月15日】苏格兰、威尔士、北爱同台签备忘录：英国会不会「一分为四」？先看谁的账单最贵", "brief": "9月14日，苏格兰首席大臣斯温尼、威尔士首席大臣阿普·约尔韦特、北爱首席部长奥尼尔在加的夫签署谅解备忘录，主张三地人民有权决定自身宪制前途，呼吁英国政府「准备、规划并推动」宪政变革。这是英国历史上第一次三个下放地区政府全部由主张独立或爱尔兰统一的政党掌舵。首相伯纳姆先是称「若出现明确共识」可考虑公投，随后又回信重申公投「不在考虑范围内」。三地诉求与时间表各不相同：苏格兰要5年内举行二次公投（需威斯敏斯特授权），新芬党瞄准2030年爱尔兰统一公投，威尔士本届任内不设时间表、先要拿到决定公投时间与议题的权力。最新民调显示，支持独立比例分别为苏格兰47%、北爱36%、威尔士32%，均未过半。", "analysis": {"主要矛盾": "伦敦给出的说法是「比起新的宪法辩论，首相更关注降低生活成本」。但恰恰是生活成本在制造分裂：能源价格上限10月再涨60英镑，鸡蛋四年涨52.4%，房租同比涨3.7%，65%家庭还挂在浮动费率上。把民族问题当次要矛盾、把经济当主要矛盾，本身没错；可经济账算不平，民族矛盾就会上升为主要矛盾——这正是《矛盾论》讲的「矛盾的主要方面在一定条件下互相转化」。要看英国分裂的主要矛盾，别去爱丁堡的议会，去超市小票上找。", "战略态势": "三地很清楚：单独打「要不要公投」这场宪法仗，自己打不赢（2022年英国最高法院已裁定苏格兰无权单方面组织公投）。所以它们干脆不在伦敦的优势战场上交手，改打「民生账本」——威尔士要王室领地收益（含海上风电用地收入）下放，苏格兰要北海油气收入分配重新算，三地都把「重返欧盟」当成核心经济论据。你打你的宪法牌，我打我的经济牌。这是弱者面对强势中央时唯一可行的持久战：不争一次胜负，争的是让「威斯敏斯特不管我们」这句话在每一张账单上被验证。", "敌友之辨": "三地联手的力量上限，写死在民调里：47%、36%、32%，全部不过半。原因在于各自要的东西并不相同——苏格兰要独立，新芬党要的是爱尔兰统一，威尔士眼下只要「决定公投的权力」。共同的对手能让三方坐到一张桌上，但共同的对手不等于共同的未来。真正能把支持率推过半数的，不是民族情绪，而是煤气费、房租、NHS排队时间这些每天都要面对的东西。谁能把这些具体痛点接住，谁才拿得到那过半数的票。", "实事求是": "备忘录不是解体宣言。它没有法律效力，不触发任何公投，三地各自的法律路径也完全不同。这次峰会实质上是「政治施压＋对外姿态」。看这件事别被「英国四分五裂」的标题带走，抓两个可验证的指标：一是苏格兰支持独立的民调何时稳定过半（民族主义阵营自己承认约60%才该举行公投），二是王室领地收益、北海油气分配这类具体财政安排有没有实质松动。前一个看人心，后一个看钱袋——两个都不动，就还只是姿态。"}, "source": "BBC · 路透社 · 《独立报》 · 卫报 · Ofgem · 9月14-15日"}, {"tag": "账单传导", "tagType": "question", "headline": "【9月15日】沙特关闭绕开霍尔木兹的备用管道，油价逼近107美元：战争的账单正在寄往每个家庭", "brief": "沙特关闭了一条绕开霍尔木兹海峡的关键备用管道，布伦特原油9月15日涨至约106.98美元/桶（+1.23%），美油报102.68美元（+1.27%）。此前也门胡塞武装对沙特能源基础设施发动新一轮袭击，海湾阿拉伯国家推迟了原定与伊朗的会谈。连锁反应已经出现：欧洲央行管委警告能源成本上涨可能迫使利率进入更具限制性的区间；印度8月CPI同比升至4.82%，为连续10个月上升；瑞安航空警告机票价格可能「大幅上涨」、部分航司将「难以存活」；英国10月起能源价格上限再涨60英镑。", "analysis": {"主要矛盾": "这一局的根本矛盾不是「谁炸了谁」，而是「全球能源的备用路线还剩几条」。霍尔木兹海峡承担全球约五分之一的石油海运量，沙特这条陆上管道本该是绕开海峡的保险，如今保险自己关了——供应侧的安全冗余在变薄，这才是油价真正的定价基础。看油价别只盯战报，要看备胎还剩几个。", "战略态势": "美国在中东同时做两件事：军事上压伊朗，经济上承受油价外溢。这是典型的「打得起、收不起」——战术上每一拳都有声响，战略上每一拳都在推高自己和盟友的通胀。伊朗的算盘正好相反：不对称消耗，把战争成本转嫁给对手的选民，让对手在选举周期里自己先撑不住。谁的时间更紧，谁就更容易先动手或者先让步。", "敌友之辨": "最难受的其实是美国的盟友。欧洲央行已在警告能源通胀可能逼利率进入限制性区间；海湾产油国推迟与伊朗的会谈，既不站队也不得罪；印度CPI十连升，央行面临加息压力。这些国家没有一个愿意为中东的战争买单，但每一个都在替它买单。谁被绑上了战车、谁在装糊涂，看清这一点，就能大致判断这场仗还能打多久。", "实事求是": "没有人能准确预测油价，但传导路径是可验证的：原油→运输成本→机票与物流→食品与日用品→通胀→利率。英国10月能源上限涨60英镑、瑞安警告机票涨价、印度CPI十连升，都是这条链上已经出现的实物证据。与其猜明天油价涨跌，不如盯住这条链——它会先告诉你，钱正在从谁的口袋里被拿走。"}, "source": "路透社 · 金融快报 · 陆家嘴财经早餐 · 央广网 · 9月15日"}], "热搜": [{"text": "#王曼昱反超孙颖莎登顶女单世界第一#", "heat": "沸", "manipulated": false}, {"text": "#iPhone18Pro最高溢价3000元#", "heat": "沸", "manipulated": true}, {"text": "#我国灵活就业人员规模已超2亿人#", "heat": "沸", "manipulated": false}, {"text": "#广汽与一汽签署意向协议#", "heat": "热", "manipulated": false}, {"text": "#黄斌公开炮轰罗永浩#", "heat": "热", "manipulated": false}, {"text": "#钟楚曦莎莎苏全球品牌代言人#", "heat": "热", "manipulated": true}, {"text": "#吃得越狠老得越慢#", "heat": "热", "manipulated": true}, {"text": "#国务院提级调查青岛船厂火灾#", "heat": "热", "manipulated": false}], "A股": [{"badge": "央企重组", "headline": "广汽集团与中国一汽签署意向协议：一汽股份将成广汽第二大股东，A股已停牌", "code": "601238.SH", "brief": "据公开报道，广汽集团与中国第一汽车集团签署意向协议，一汽股份将成为广汽第二大股东，广汽A股股票已停牌。此为市场流传信息与媒体报道，交易对价、股权比例及后续审批等细节须以公司正式公告为准。", "analysis": {"真实意图": "若属实，这是国资汽车体系内又一次「合并同类项」。上一轮是券商（中金吸收合并东兴、信达），这一轮轮到整车厂。逻辑不在单笔交易赚多少钱，而在国资体系内减少同质化竞争、集中资源做海外与新能源。整合的受益者通常不是股价，是产业话语权。", "话语权分析": "停牌前的消息面往往会先跑一轮，但真正的定价发生在方案披露之后——换股比例、注入资产、谁并谁、谁管事。看这类整合，先问三个问题：谁是新平台的主导方、原有管理层怎么安排、注入资产的估值是便宜还是贵。这三个问题的答案，决定了这是真整合还是数字游戏。", "中道提醒": "国资重组是慢变量，通常以年计而非以日计。消息落地当天的情绪溢价，和三年后产业格局的实际改变，完全是两回事。凡是「一停牌就兴奋」的，多半没经历过方案被否或者长期停牌。"}, "source": "市场公开报道（待公司正式公告交叉验证）· 9月15日"}, {"badge": "并购收官", "headline": "东兴证券、信达证券今日起连续停牌直至终止上市，股东换股为中金公司A股", "code": "601995.SH", "brief": "东兴证券、信达证券公告，公司A股股票自9月15日起连续停牌直至终止上市，公司股东所持股票将按换股比例转换为中金公司A股股票。这标志着中金公司吸收合并东兴证券、信达证券进入实操收官阶段。同日央行公告9月15日开展5000亿元买断式逆回购操作，期限6个月，为等量续作。", "analysis": {"真实意图": "券商「国家队」合并进入最后一公里：从9月8日上会到9月15日停牌换股，节奏极快。合并的真实目的不是把三家并成一家更大的券商，而是集中投行与研究资源，形成能与国际大行正面竞争的自营与承销平台。券商整合看的是行业格局重排，不是单日涨跌。", "话语权分析": "换股比例是这轮整合里唯一真正重要的事。对被并入方股东，价格由换股比例决定，不由情绪决定；对存续方股东，摊薄与增厚要在方案里算细账。市场上关于「券商大合并利好」的叙事很热闹，但比例一定，价值就定了，其余都是噪音。", "中道提醒": "并购完成之后，真正的考验才刚开始：人员整合、文化融合、客户重叠。历史上大型金融机构合并后「三年不见协同」的例子不少。看并购别只看签约新闻，看三年后的人均产能与成本收入比。"}, "source": "央广网 · 中国证券网（公告）· 9月15日"}, {"badge": "跨界并购", "headline": "香山股份拟发行股份及支付现金收购武珞智慧100%股权，对价暂定8亿元，切入AI算力", "code": "002870.SZ", "brief": "香山股份公告，拟向宁波亘曦、浙江秦桐、智焱芯合、温州群宏、瑞晟智能、王凌发行股份及支付现金购买其合计持有的武珞智慧100%股权，交易总对价暂定为8亿元，并募集配套资金。交易完成后公司将新增AI算力设备业务，形成「汽车零部件＋AI算力」双轮驱动格局。公司股票9月15日复牌。", "analysis": {"真实意图": "一家汽车零部件公司，用8亿买一张「AI算力」入场券。这类跨界的核心动机通常是估值切换：传统制造业估值中枢在20倍以下，AI算力标的可以给到更高倍数。买的是资产，更是叙事。", "话语权分析": "跨界并购最关键的不是标的贵不贵，是能不能并表、能不能做出业绩承诺、原来的主业还能不能养活新业务。看这类交易先看一条：交易对方是谁、有没有业绩对赌、对赌期多长。没有对赌的跨界收购，风险基本由中小股东承担。", "中道提醒": "「双轮驱动」这个词在公告里出现得越多，越要警惕两个轮子转速不一样。跨界成功的少数案例，共同点都是新业务与老主业存在真实的客户或技术复用；如果两个轮子毫无交集，那更可能是「一个轮子在转，另一个在讲故事」。"}, "source": "中国证券网 · 上市公司公告 · 9月15日"}, {"badge": "流动性", "headline": "8月末社融存量464.8万亿元同比增7.2%，债券与股票融资占比升至50.31%首次明显超过贷款", "code": "宏观", "brief": "央行数据显示，8月末社会融资规模存量464.8万亿元，同比增长7.2%；本外币存款余额355.77万亿元，同比增长7.8%；前8个月人民币存款增加18.99万亿元、贷款增加10.44万亿元。前8个月债券和股票融资在社会融资规模增量中占比升至50.31%，已明显超过贷款占比，较2021年同期高近20个百分点。同时，五部门就治理中小企业回款难集体发声，引导龙头企业率先发布并践行60日付款承诺，将对变相延长账期依法严厉处罚。", "analysis": {"真实意图": "社融结构的变化比总量更重要：直接融资占比首次明显超过间接融资，意味着企业的资金来源正从「银行给钱」转向「市场给钱」。这是融资结构的长期转向，不是短期波动。货币政策的着力点也从单纯放量转向疏通渠道。", "话语权分析": "「龙头企业率先践行60日付款承诺」是这一天里最落地的一条政策。中小企业回款难的本质，是链主企业用账期无偿占用上游资金——用别人的钱做自己的生意。治理这个，等于把一部分隐性融资成本从中小企业身上挪回链主身上，是真正的利益再分配。", "中道提醒": "账期治理关键在「变相」两个字：明面上60天，实际上用商票、验收、结算周期拉长到180天，这类操作太多了。看政策效果别看承诺名单，看中小企业的实际现金流回正时间。数据不会说谎，承诺会。"}, "source": "央行 · 中国证券网 · 央广网 · 9月15日"}], "深圳": [{"headline": "深圳今年已新增基础教育学位1.7万个，560所学校实现午休「舒心躺睡」", "brief": "深圳今年计划新增基础教育学位4万个（含公办高中学位1万个），截至8月已完成1.7万个，年底有望如期达标。目前全市560所义务教育学校实现午休「舒心躺睡」，近70万名学生受益。市政协委员建议紧盯学位建设节点、优化学位布局，并提出AI赋能教育应坚持教师主导，同时推动师资下沉促进教育均衡。", "source": "深圳新闻网 · 深圳市教育局 · 9月15日"}, {"headline": "深圳限行新规9月17日起施行：工作日早晚高峰限行外地车，每月可在线申请免限行", "brief": "深圳限行新政策将于9月17日起施行，有效期至2027年9月16日。工作日早晚高峰对非深号牌小型汽车实施限行，进出口岸、机场等指定道路除外；外地车每月可在线申请一次免限行，前两次违规免予处罚。原有通行管理措施同步调整，车主需提前确认常走路段是否在限行范围内。", "source": "深圳市交警局 · 9月15日"}, {"headline": "前8个月深圳对其他金砖成员国进出口2468.9亿元，同比增长11.5%", "brief": "今年前8个月，深圳对其他金砖成员国进出口货值达2468.9亿元，同比增长11.5%，其中出口2077.7亿元（+7.5%）、进口391.2亿元（+38.9%）。深圳智能清洁、显示等制造产品热销巴西、南非市场；巴西冷冻肉类、南非鲜果等商品加快进入国内市场。深圳海关推出绿色通道、享惠通关等惠企举措，保障进出口货物高效通关。", "source": "深圳海关 · 深圳新闻网 · 9月15日"}, {"headline": "深圳16岁小将孙心然夺美网青少年女单冠军；深圳数据交易所入选全国首批国家数据产权登记机构", "brief": "当地时间9月12日，2026美网青少年组女单决赛，深圳16岁选手、头号种子孙心然三盘苦战击败对手，首次夺得大满贯青少年女单冠军。她6岁起练球、11岁确立职业方向，本赛季连续闯入三大满贯青少年女单决赛并登顶ITF青少年世界第一。另据国家数据局，9月11日全国数据产权登记机构遴选结果公布，深圳数据交易所入选，成为率先获批的三家国家数据产权登记机构之一。", "source": "深圳新闻网 · 国家数据局 · 9月12-15日"}], "定锚": {"quote": "「三家分晋」：一个国家的解体，不从边境开始。", "sub": "《资治通鉴》开篇不从夏商周写起，从「三家分晋」写起：韩、赵、魏三家大夫瓜分晋国，周天子不但不讨伐，反而册封他们为诸侯。司马光说，这才是战国乱世真正的起点——不是兵败，是名分失守。\n\n晋国当年是中原最强的诸侯。它亡于外敌了吗？没有。它是被内部的六卿一步步架空，最后被三家分掉的。\n\n毛泽东在《矛盾论》里讲：「外因是变化的条件，内因是变化的根据，外因通过内因而起作用。」真正让一个国家、一件事、一个人垮掉的，几乎从来不是外面的对手，是里面的裂缝。\n\n今天的英国就是这样。三地同台签备忘录，看客都盯着唐宁街怎么回话；可真正把三地推到一张桌上的，是能源价格上限10月再涨60英镑、鸡蛋四年涨了52.4%、房租还在涨、NHS还在排队。这些数字不是「外因」，它们就是那条裂缝的宽度。\n\n同一个道理放在自己身上：一个人被时代淘汰，很少是因为对手太强，多半是自己手上没本事、脚下没根。别急着研究对手，先看看自己哪块松了。\n\n（今日沿用毛主席的方法读一则老典故，明日恢复常态。）", "actions": ["先分内外：遇事第一问是「外因是什么、内因是什么」，把力气先花在自己那块松掉的地方", "看局面别只看对手动作，看对手自己哪里在裂——裂缝从不上头条，但决定结局", "把注意力从「别人怎么样」挪回「我今天做成了什么」：内因才是变化的根据"]}};

  const delays = ['delay-1','delay-2','delay-3','delay-4','delay-5'];

    for(const it of (cont.items||[])) {
      const rcls = it.rank<=3?'top':'normal';

      const sub = it.brief.length>46 ? it.brief.slice(0,46)+'…' : it.brief;
      html += '<div class="hot-item"><span class="hot-rank '+rcls+'">'+it.rank+'</span><div class="hot-main"><div class="hot-title">'+it.title+'</div><div class="hot-sub">'+sub+'</div><div class="hot-detail"><span>'+it.brief+'</span><div class="hot-note">💡 '+it.note+'</div></div></div><div class="hot-meta"><span class="hot-level '+lvcls+'">'+it.level+'</span><span class="hot-heat">'+it.heat+'</span></div></div>';
    }
    html += '</div>';
  }
  html += '<div class="hot-hint">点击任意一条展开「当地人在想什么」</div></section>';

  // 今日风向
  html += '<section class="section fade-in '+delays[1]+'"><div class="section-title foldable"><span class="section-icon">🔍</span>今日风向<span class="section-count">叙事解剖</span><span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.风向||[])) {
    const tc = item.tagType==='question'?'tag-question':item.tagType==='doubt'?'tag-doubt':item.tagType==='manipulated'?'tag-manipulated':'tag-trusted';
    const pref = item.tagType==='question'?'● ':item.tagType==='manipulated'?'◆ ':'';
    html += '<div class="card"><span class="card-tag '+tc+'">'+pref+item.tag+'</span><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">叙事解剖</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 国内热搜（对照镜）
  const fc = (data.热搜||[]).filter(t=>t.manipulated).length;
  html += '<section class="section fade-in '+delays[2]+'"><div class="section-title foldable"><span class="section-icon">🔥</span>国内热搜<span class="section-count">'+fc+'条可疑</span><span class="fold-arrow">▼</span></div><div class="fold-body"><div class="topic-list">';
  for(const t of (data.热搜||[])) {
    html += '<div class="topic-chip'+ (t.manipulated?' manipulated':'') +'">'+(t.manipulated?'<span class="manipulated-dot"></span>':'')+'<span>'+t.text+'</span><span class="topic-heat">'+t.heat+'</span></div>';
  }
  html += '</div><div style="margin-top:8px;font-size:0.72rem;color:var(--text-muted)">◆ 紫色标记 = 疑似人为操纵热搜<br>判别标准：话题突升陡降、无事件支撑、短期内集中出现</div></div></section>';

  // A股棋局
  html += '<section class="section fade-in '+delays[3]+'"><div class="section-title foldable"><span class="section-icon">📊</span>A股棋局<span class="section-count">今日关注</span><span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.A股||[])) {
    html += '<div class="card stock-card"><div class="card-headline"><span class="stock-badge">'+item.badge+'</span><span>'+item.headline+'</span></div>'+(item.code?'<span class="stock-code">'+item.code+'</span>':'')+'<div class="card-brief" style="margin-top:6px">'+item.brief+'</div><div class="card-analysis"><div class="card-analysis-label">棋局解读</div>';
    for(const [k,v] of Object.entries(item.analysis||{})) {
      html += '<div class="card-analysis-row"><span class="card-analysis-key">'+k+'</span><span class="card-analysis-val">'+v+'</span></div>';
    }
    html += '</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 深圳在地
  html += '<section class="section fade-in '+delays[4]+'"><div class="section-title foldable"><span class="section-icon">🏙️</span>深圳在地<span class="fold-arrow">▼</span></div><div class="fold-body">';
  for(const item of (data.深圳||[])) {
    html += '<div class="card"><div class="card-headline">'+item.headline+'</div><div class="card-brief">'+item.brief+'</div><div class="card-meta"><span class="card-source"><span class="card-source-dot"></span>'+item.source+'</span></div></div>';
  }
  html += '</div></section>';

  // 每日定锚
  const a = data.定锚||{};
  html += '<section class="section fade-in"><div class="section-title"><span class="section-icon">🪦</span>每日定锚</div><div class="tombstone"><div class="tombstone-label">墓 志 铭</div><div class="tombstone-quote">'+(a.quote||'')+'</div><div class="tombstone-sub">'+(a.sub||'').replace(/\n/g,'<br>')+'</div><div class="tombstone-divider"></div><div class="tombstone-actions">';
  const nums = ['一','二','三','四','五'];
  for(let i=0;i<(a.actions||[]).length;i++) {
    html += '<div class="tombstone-action"><span class="tombstone-action-num">'+nums[i]+'</span><span>'+a.actions[i]+'</span></div>';
  }
  html += '</div></div></section>';

  document.getElementById('contentSections').innerHTML = html;

  // Click: fold sections / expand cards / expand hot items
  document.addEventListener('click', function(e) {
    const fold = e.target.closest('.foldable');
    if(fold) {
      fold.classList.toggle('collapsed');
      const body = fold.closest('section').querySelector('.fold-body');
      if(body) body.style.display = body.style.display==='none'?'block':'none';
      return;
    }
    const card = e.target.closest('.card');
    if(card) {
      const an = card.querySelector('.card-analysis');
      if(an) an.style.display = an.style.display==='none'?'block':'none';
      return;
    }
    const hot = e.target.closest('.hot-item');
    if(hot) {
      const d = hot.querySelector('.hot-detail');
      if(d) d.style.display = d.style.display==='block'?'none':'block';
      hot.classList.toggle('open', d && d.style.display==='block');
    }
  });

  // Pull to refresh
  let ts = 0;
  const ind = document.createElement('div');
  ind.className = 'pull-indicator';
  ind.textContent = '↓ 下拉刷新';
  document.querySelector('.app-container').prepend(ind);
  document.addEventListener('touchstart', e => { ts = e.touches[0].clientY; });
  document.addEventListener('touchmove', e => {
    if(window.scrollY===0 && e.touches[0].clientY-ts>60) {
      ind.style.opacity = '1'; ind.textContent = '释放刷新';
    }
  });
  document.addEventListener('touchend', () => {
    if(ind.style.opacity==='1') { ind.textContent='正在刷新...'; setTimeout(()=>location.reload(),500); }
    ind.style.opacity = '0';
  });

})();
</script>
</body>
</html>
